volumes:
  clsi-cache:
  mongo-data:
  redis-data:
  sharelatex-data:
  web-data:
  pg-data:
  sw-master-data:
  sw-filer-data:
  sw-volume-data:

services:
  clsi:
    build:
      context: ..
      dockerfile: services/clsi/Dockerfile
      target: with-texlive
    env_file:
      - dev.env
    environment:
      - SANDBOXED_COMPILES=false
    user: root
    volumes:
      - ${PWD}/compiles:/overleaf/services/clsi/compiles
      - ${PWD}/output:/overleaf/services/clsi/output
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - clsi-cache:/overleaf/services/clsi/cache

  clsi-nginx:
    image: nginx:1.28
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    volumes:
      - ${PWD}/output:/output:ro
      - ../services/clsi/nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
  document-updater:
    build:
      context: ..
      dockerfile: services/document-updater/Dockerfile
    env_file:
      - dev.env
  history-v1:
    build:
      context: ..
      dockerfile: services/history-v1/Dockerfile
    env_file:
      - dev.env
    environment:
      # 2026-09-27 (owner G1/G2): PG plane (postgres:18-alpine) + S3 plane
      # (SeaweedFS replaces the fs backend; plain bucket names).
      DATABASE_URL: postgres://overleaf:overleaf@postgres:5432/overleaf-history-v1
      PERSISTOR_BACKEND: s3
      BACKEND: s3
      BUCKET_NAME: docstore-archive
      AWS_S3_ENDPOINT: http://s3:8333
      AWS_S3_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: dev
      AWS_SECRET_ACCESS_KEY: dev-secret
      OVERLEAF_EDITOR_ANALYTICS_BUCKET: analytics
      OVERLEAF_EDITOR_BLOBS_BUCKET: globalblobs
      OVERLEAF_EDITOR_CHUNKS_BUCKET: chunks
      OVERLEAF_EDITOR_PROJECT_BLOBS_BUCKET: projectblobs
      OVERLEAF_EDITOR_ZIPS_BUCKET: zips
    depends_on:
      postgres:
        condition: service_healthy
      sw-init:
        condition: service_completed_successfully
  postgres:
    image: postgres:18-alpine  # 2026-09-27 (owner): tree-wide PG anchor
    environment:
      POSTGRES_USER: overleaf
      POSTGRES_PASSWORD: overleaf
      POSTGRES_DB: overleaf-history-v1
    ports:
      - "127.0.0.1:5432:5432" # for debugging
    volumes:
      - pg-data:/var/lib/postgresql   # PG18+ layout: mount at /var/lib/postgresql (not /data)
    healthcheck:
      test: pg_isready --host=localhost --quiet
      interval: 1s
      retries: 20

  # SeaweedFS (G2/STOR-1) — 1:1 mirror of the compose_cep reference services.
  sw-master:
    image: chrislusf/seaweedfs:latest
    command: master -ip=master -ip.bind=0.0.0.0 -metricsPort=9327
    volumes:
      - sw-master-data:/data
    networks:
      default:
        aliases: [master]
  sw-filer:
    image: chrislusf/seaweedfs:latest
    command: filer -master="master:9333" -ip=filer -ip.bind=0.0.0.0
    volumes:
      - sw-filer-data:/data
    depends_on:
      - sw-master
    networks:
      default:
        aliases: [filer]
  sw-volume:
    image: chrislusf/seaweedfs:latest
    command: volume -mserver="master:9333" -ip=volume -ip.bind=0.0.0.0 -port=8080 -dir=/data -max=0
    volumes:
      - sw-volume-data:/data
    depends_on:
      - sw-master
    networks:
      default:
        aliases: [volume]
  sw-s3:
    image: chrislusf/seaweedfs:latest
    command: s3 -filer="filer:8888" -ip.bind=0.0.0.0
    depends_on:
      - sw-filer
    networks:
      default:
        aliases: [s3]
  sw-init:
    image: curlimages/curl:latest
    entrypoint: sh
    command: ["-c", "while :; do if curl -sf -o /dev/null http://s3:8333/; then ok=1; for b in templatefiles projectblobs globalblobs chunks zips analytics; do code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://s3:8333/$$b); case $$code in 200|409) : ;; *) ok=0 ;; esac; done; [ $$ok -eq 1 ] && exit 0; fi; sleep 2; done"]
    depends_on:
      - sw-s3

  mongo:

    # 2026-09-26 (owner): pin to the tree-wide anchor (tests/e2e T9): mongo
    # 8.3 + GLIBC hwcaps workaround (SERVER-121912 / SHSTK segfault on this
    # host kernel — toolkit applies the same to the prod mongo).
    image: mongo:8.3
    environment:
      GLIBC_TUNABLES: glibc.cpu.hwcaps=-SHSTK
      MONGO_INITDB_DATABASE: sharelatex
    command: --replSet overleaf
    ports:
      - "127.0.0.1:27017:27017" # for debugging
    volumes:
      - mongo-data:/data/db
      - ../bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js
    extra_hosts:
      # Required when using the automatic database setup for initializing the
      # replica set. This override is not needed when running the setup after
      # starting up mongo.
      - mongo:127.0.0.1
  project-history:
    build:
      context: ..
      dockerfile: services/project-history/Dockerfile
    env_file:
      - dev.env

  real-time:
    # D28a: the event bus is a Go service (socket.io 0.9 wire, 1:1 with the
    # retired Node services/real-time). Runs the baked binary from the main
    # image — build it first: (cd server-ce && make all).
    image: ollitex/ollitex:main
    command: ["/bin/sh", "-c", "exec /usr/local/bin/go-services/realtime"]
    env_file:
      - dev.env
    environment:
      - REAL_TIME_REDIS_HOST=redis

  redis:
    # 2026-09-26 (owner): aligned with the tree-wide anchor (tests/e2e T9: redis 8.6-alpine).
    image: redis:8.6-alpine
    ports:
      - "127.0.0.1:6379:6379" # for debugging
    volumes:
      - redis-data:/data

  # 2026-09-16 (owner task T5): free local SMTP relay + capture API.
  # Reuses the dev web build (node is present; entrypoint overridden).
  # Check captured mail: curl http://127.0.0.1:8025/api/messages
  smtpsink:
    build:
      context: ..
      dockerfile: services/web/Dockerfile
      target: dev
    # env -u NODE_OPTIONS: the web build preloads its Yarn PnP hooks, which
    # break running a standalone CJS script; the sink needs none of them.
    entrypoint: ["env", "-u", "NODE_OPTIONS", "node"]
    command: ["/sink/smtp-sink.js"]
    volumes:
      - ../tests/e2e/tools/smtp-sink.js:/sink/smtp-sink.js:ro
    ports:
      - "127.0.0.1:8025:8025"

  web:
    build:
      context: ..
      dockerfile: services/web/Dockerfile
      target: dev
    env_file:
      - dev.env
    environment:
      - APP_NAME=Overleaf Community Edition
      - ENABLED_LINKED_FILE_TYPES=project_file,project_output_file,zotero
      - EMAIL_CONFIRMATION_DISABLED=true
      - NODE_ENV=development
      - OVERLEAF_ALLOW_PUBLIC_ACCESS=true
      # LanguageTool (grammar check) — env fallback for the admin UI.
      # The admin can also set a URL directly on the LLM admin settings
      # page (Admin > LLM Settings). See services/web/modules/languagetool.
      - LANGUAGE_TOOL_HOST=languagetool
      - LANGUAGE_TOOL_PORT=8010
      # 2026-09-16 (owner task T5): local SMTP sink -> enables the
      # password-reset / test e-mail / registration mails in local dev.
      - OVERLEAF_EMAIL_FROM_ADDRESS=OlliTeX <noreply@example.com>
      - OVERLEAF_EMAIL_DRIVER=smtp
      - OVERLEAF_EMAIL_SMTP_HOST=smtpsink
      - OVERLEAF_EMAIL_SMTP_PORT=1025
      - OVERLEAF_EMAIL_SMTP_SECURE=false
      # 2026-09 (mega-batch): SP cert for SAML SP-signing metadata (test fixture)
      - OVERLEAF_SAML_PUBLIC_CERT=/e2e-saml/sp-cert.pem
      # template gallery on by default (admin can toggle in /hub)
      - OVERLEAF_TEMPLATE_GALLERY=true
    command: ["node", "app.mjs"]
    volumes:
      - sharelatex-data:/var/lib/overleaf
      - web-data:/overleaf/services/web/data
      - ../tests/e2e/fixtures/saml/sp-cert.pem:/e2e-saml/sp-cert.pem:ro
    depends_on:
      - mongo
      - redis
      - smtpsink
      - sw-init
      - clsi
      - document-updater
      - history-v1
      - project-history
      - real-time
      - languagetool

  webpack:
    build:
      context: ..
      dockerfile: services/web/Dockerfile
      target: webpack
    command:
      ["npx", "webpack", "serve", "--config", "webpack.config.dev-env.js"]
    ports:
      - "127.0.0.1:80:3808"
    volumes:
      - ./webpack.config.dev-env.js:/overleaf/services/web/webpack.config.dev-env.js

  git-bridge:
    # D14 (2026-09-26): 1:1 Go git-bridge (go/services/gitbridge) replaces the
    # retired Java service (services/git-bridge deleted).
    #   build:  go/services/gitbridge/build.sh   -> ollitex/git-bridge:latest
    #   rollback: image: sharelatex/git-bridge:ext-6.3.0-port
    #             command: ['/server-pro-start.sh']   (revive the Java service)
    image: ollitex/git-bridge:latest
    user: root
    command: ['git_bridge', 'serve', '/conf/runtime.json']
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: "DEBUG"
    volumes:
      - ./gitbridge-runtime.json:/conf/runtime.json:ro
      - ./data/git-bridge:/data/git-bridge

  # LanguageTool server (grammar check). The web service proxies
  # GET /languagetool/languages and POST /languagetool/check to it; the admin
  # can also point at any other server via the LLM admin settings page
  # (or LANGUAGE_TOOL_URL). `./ngrams` holds the LT language models
  # (langtool_languageModel=/ngrams) — populate it for full rule quality.
  languagetool:
    image: erikvl87/languagetool:latest
    container_name: languagetool
    hostname: languagetool
    restart: unless-stopped

    environment:
      - Java_Xms=512m
      - Java_Xmx=2g
      - langtool_languageModel=/ngrams

    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --timeout=5 http://localhost:8010/v2/languages 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - "8010:8010"

    volumes:
      - ./ngrams:/ngrams:ro
