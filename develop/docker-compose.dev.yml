# Hot-reload overlays for the develop stack (docker/docker-compose.dev.yml).
# The five previously-listed Node services (chat, docstore, filestore,
# linked-url-proxy, notifications) were replaced by their Go implementations
# (go/services/<name>) and removed from the tree, so they no longer have a
# Node source to hot-reload and are dropped here.
services:
  clsi:
    # Go clsi (node app retired 2026-09-29): baked binary from the main
    # image (rebuild first: (cd server-ce && make all)).
    image: ollitex/ollitex:main
    command: ["/bin/sh", "-c", "exec /usr/local/bin/go-services/clsitex"]
    environment:
      - SANDBOXED_COMPILES=false



  real-time:
    # D28a: Go bus — static binary, no hot-mounts. After changing
    # go/services/realtime (or cmd/realtime): (cd server-ce && make all)
    # then `docker compose -f docker-compose.yml -f docker-compose.dev.yml
    # up -d real-time`.
    command: ["/bin/sh", "-c", "exec /usr/local/bin/go-services/realtime"]

  web:
    command: ["node", "--watch", "app.mjs", "--watch-locales"]
    environment:
      - NODE_OPTIONS=--inspect=0.0.0.0:9229
    ports:
      - "127.0.0.1:9229:9229"
    volumes:
      - ../services/web/app:/overleaf/services/web/app
      - ../services/web/app.mjs:/overleaf/services/web/app.mjs
      - ../services/web/config:/overleaf/services/web/config
      - ../locales:/overleaf/locales
      - ../services/web/modules:/overleaf/services/web/modules
      - ../public:/overleaf/public

  webpack:
    volumes:
      - ../services/web/app:/overleaf/services/web/app
      - ../services/web/config:/overleaf/services/web/config
      - ../frontend:/overleaf/frontend
      - ../locales:/overleaf/locales
      - ../services/web/modules:/overleaf/services/web/modules
      - ../public:/overleaf/public
      - ../services/web/transform:/overleaf/services/web/transform
      - ../services/web/types:/overleaf/services/web/types
      - ../services/web/webpack-plugins:/overleaf/services/web/webpack-plugins
