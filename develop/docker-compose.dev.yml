# Dev overlay (2026-11-16 rewrite).
#
# In the OLD Node split this overlay carried the hot-reload wiring
# (node --watch, ../junk/services-web/* mounts, 9229 inspector port).
# That loop is architecturally dead with the Go superstack (the web app is
# a baked binary; the frontend is baked too). The dev loop today:
#
#   1. change Go/frontend source in this repo
#   2. rebuild the image (repo root: `make images`, or the rebuild skill —
#      builds from this checkout's own build-support folder)
#   3. `bin/up` again (or `docker compose -f docker-compose.yml
#      -f docker-compose.dev.yml up --force-recreate -d web`)
#
# The overlay therefore carries only explicit dev toggles (currently:
# nothing extra — the base compose is already the dev configuration).
# Kept as a file so `bin/*` invocations stay stable.
name: ollitex-dev

