# P6.18 — page-shells module surface, flipped to the OlliTeX Go web
# (WEB_GO_PLAN.md P6.18). services/web/modules/page-shells (2 routes):
#   GET /user/mysettings (requireLogin)          → 301 /hub#/mysettings.account
#   GET /admin/panel     (ensureUserIsSiteAdmin) → 301 /hub#/overview
#                                              non-admin → 302 /restricted?from=%2Fadmin%2Fpanel
# No method guard (unlike the single-method modules): the Go core chain
# reproduces Node's non-GET behavior on these paths exactly — 403
# "Forbidden" (csrf gate) and the express-style OPTIONS auto-response
# (200 Allow) — both A/B-verified 2026-09-19 (p618 probe log).
#
# Path variants (different case, trailing slashes, double slashes,
# subpaths) are NOT matched here: nginx exact-match locations send only
# the canonical path to Go; the variants fall through to Node, which
# answers them itself (parity by construction — express is
# case-insensitive and slash-tolerant there).

location = /user/mysettings {
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}

location = /admin/panel {
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
