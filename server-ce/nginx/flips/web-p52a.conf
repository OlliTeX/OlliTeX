# WEB_GO_PLAN P5.2a — COMPILE CONTROL PLANE flip (OlliTeX Go web).
#
# The two session-POST compile routes (Node CompileController, live-pinned
# 2026-09-15; Express routing is case-insensitive so both /Project/ and
# /project/ spellings are served):
#
#   POST /Project/<24-hex>/compile          (CompileController.compile)
#   POST /Project/<24-hex>/compile/stop     (CompileController.stopCompile)
#
# go to the Go shadow (127.0.0.1:4010). The compile ENGINE remains the Node
# `clsi` service on 127.0.0.1:3013 — Go posts the same
# /project/<pid>/user/<uid>/compile request Node does and reshapes the
# same {compile:{...}} response. Everything else STAYS on Node (4000):
# every non-POST verb, the read/output routes (GET
# /project/:id/output/cached/output.overleaf.json, /download/project/:id/
# build/... — P5.2b), and deeper editor sub-routes.
#
# The regex is QUOTED — nginx's config tokenizer treats unquoted { } as
# token delimiters (web-p51a lesson).
location ~ "^/[Pp]roject/[0-9a-f]{24}/compile(?:/stop)?\z" {
  if ($request_method !~ ^(POST)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}
