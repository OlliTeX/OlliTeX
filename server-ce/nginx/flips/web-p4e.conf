# WEB_GO_PLAN P4.5 — project rename flip (OlliTeX Go web).
#
# Route flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (router.mjs:798 + ProjectController.renameProject +
#  ProjectDetailsHandler.renameProject):
#
#   POST /project/:Project_id/rename
#       → requireLogin → ensureUserCanAdminProject (owner or site-admin)
#       → body { newProjectName: "<string>" }  (trim; blank -> 400)
#       → sets project.name  (NO audit entry)
#       → 200 text/plain "OK"
#
# nginx location is method-agnostic, so a single regex location flips the
# POST. The project id is a dynamic single segment + literal "rename" —
# mirroring Node's `:Project_id/rename` (empty id does NOT match → Node 404).

location ~ ^/project/[^/]+/rename\z {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
