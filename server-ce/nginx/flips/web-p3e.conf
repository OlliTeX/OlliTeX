# WEB_GO_PLAN P3.6 — Manage/Site SiteSettings leaf flips (OlliTeX Go web).
#
# Routes flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (modules/admin-tools/.../AdminToolsRouter.mjs + Features/SiteSettings/*):
#
#   GET    /admin/site                                → 302 /hub#/site
#   GET    /admin/site-settings                        → all sections (JSON)
#   PUT    /admin/site-settings/:section              → upsert a section
#   POST   /admin/site-settings/email/test            → test e-mail
#   GET    /admin/site/template-admins                → template-admin list (JSON)
#
# `location =` exact covers the single-path routes; the `/admin/site-settings/`
# prefix covers every `PUT /admin/site-settings/:section` and the
# `POST .../email/test` (exact would also win, but the prefix catches the
# variable sections). Node and Go share Mongo/Redis, so the site_settings doc,
# the managed storage env fragment and the email/test in-memory rate window are
# shared state — the gate resets the storage section + signup between legs and
# flushes the smtp sink.

location = /admin/site {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /admin/site-settings {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /admin/site-settings/ {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /admin/site/template-admins {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
