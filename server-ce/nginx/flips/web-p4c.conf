# WEB_GO_PLAN P4.3 — project members flip (OlliTeX Go web).
#
# Route flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (router.mjs:545 + Features/Collaborators/CollaboratorsRouter.apply +
# CollaboratorsController.getAllMembers + CollaboratorsGetter.getAllInvitedMembers):
#
#   GET /project/:Project_id/members
#       → requireLogin → blockRestrictedUserFromProject → ensureUserCanReadProject
#       → { members: [ {_id, first_name, last_name, email, privileges,
#                       signUpDate[, pendingEditor[, pendingReviewer]]} ] }
#
# The project id is a dynamic single path segment, so this is a REGEX
# location (one non-empty segment, mirroring Node's `:Project_id` — the
# empty-id URL does NOT match and falls through to Node's 404). Node and Go
# share Mongo (projects/users) + Redis (session), so the auth session is
# shared state — the gate uses one logged-in session per leg.

location ~ ^/project/[^/]+/members\z {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
