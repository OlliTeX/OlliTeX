# WEB_GO_PLAN P4.12a — file proxy flip (OlliTeX Go web).
#
# Node sources (oracle):
#   router.mjs — GET|HEAD /Project/:Project_id/file/:File_id
#   FileStore/FileStoreController.mjs (getFile: headers + blob stream;
#   getFileHead; ghost file → 404 empty; history-v1 basic auth chain)
#
# NOTE: path case matters — the file proxy is UPPERCASE /Project (this
# location), the editor entity routes are lowercase /project (web-p411b).
# Method guards keep Node-handled verbs on Node.

location ~ ^/Project/[^/]+/file/[^/]+\z {
  if ($request_method !~ ^(GET|HEAD)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
