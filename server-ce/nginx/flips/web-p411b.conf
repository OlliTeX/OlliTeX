# WEB_GO_PLAN P4.11b — editor entity DELETION flip (OlliTeX Go web).
#
# Node sources (oracle):
#   EditorRouter.mjs — DELETE /project/:Project_id/{doc,file,folder}/:entity_id
#   EditorHttpController.mjs (_deleteEntity: zz.objectId params, 204 on ok)
#   ProjectEntityUpdateHandler.mjs (deleteEntity, _cleanUpEntity, _cleanUpDoc)
#   ProjectEntityMongoUpdateHandler.mjs (root-folder guard, findElement,
#   _removeElementFromMongoArray: $pull parent-array + $inc version)
#   DocstoreManager.mjs (deleteDoc → PATCH, 404 → NotFoundError)
#
# Method guards keep Node-handled verbs on Node.

location ~ ^/project/[^/]+/doc/[^/]+\z {
  # P4.12c: the Go docapi trio now also owns GET|POST on this path
  # (private API); DELETE stays the P4.11b entity deletion. Other verbs
  # keep flowing to Node (web-profile gate behavior).
  if ($request_method !~ ^(DELETE|GET|POST)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/project/[^/]+/file/[^/]+\z {
  if ($request_method !~ ^(DELETE)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/project/[^/]+/folder/[^/]+\z {
  if ($request_method !~ ^(DELETE)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
