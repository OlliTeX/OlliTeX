# P7 completion U2 — the editor-entry route family (Go web drop-in),
# flipped to the OlliTeX Go shadow (127.0.0.1:4010), pinned by the live Node
# oracle (WEB_GO_PLAN.md U2, gate tests/e2e/specs/parity/web-go-u2-editor).
#
#   GET /editor/:Project_id[/:detacher|:detached]
#   GET /Project/:Project_id[/:detacher|:detached]
#     — Node/Express routing is case-INsensitive: the prefixes in ANY case
#     (editor|project) and the 24-hex id in either hex case render the
#     editor; a non-empty invalid id is Node's exact 404 JSON; the empty
#     id splits (/editor/ → 404 page, /project/ → 301 /hub#/projects.all);
#     anonymous → 302 /login (auth first).
#
# Method guard on every entry (wrong method falls through to "location /"
# → Node, same as the pinned U1/p620 confs). Case-insensitive matching via
# nginx's `~*` regex locations.

location ~* ^/(editor|project)/[0-9a-f]{24}(/(detacher|detached))?$ {
  if ($request_method !~ ^(GET)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
# Non-empty invalid id (Node: 404 JSON objectId validator wire) — after the
# valid-id location (regex locations are matched in file order).
location ~* ^/(editor|project)/[^/]+((/(detacher|detached))?$) {
  if ($request_method !~ ^(GET)$) { proxy_pass http://127.0.0.1:4000; }

  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
# /project/ (any case, exactly one trailing slash) → dashboard 301
# (Node ExpressLocals dashboard redirects family).
location ~* ^/project/$ {
  if ($request_method !~ ^(GET)$) { proxy_pass http://127.0.0.1:4000; }

  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
