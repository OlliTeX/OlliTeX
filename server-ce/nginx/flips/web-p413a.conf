# WEB_GO_PLAN P4.13a — project file/doc upload flip (OlliTeX Go web).
#
# Route flipped to the Go shadow (127.0.0.1:4010), pinned by the source:
#
#   POST /Project/:Project_id/upload  (UploadsRouter.mjs fileUploadEndpoint)
#
# Node pipeline (pinned, oracle 2026-09-15 probes):
#   csrf (global) → rateLimit → requireLogin →
#   ensureUserCanWriteProjectContent (403 restricted/{"message":"restricted"})
#   → multer single 'qqfile' → parseReq VA (query.folder_id present-validated,
#     body.file required: 400 invalid_upload_request; bad folder_id: 400
#     objectId VA) → name length (422 invalid_filename) → project + access
#   → findElement (422 folder_not_found, incl. absent folder_id) →
#   upsertDoc | upsertFile (docstore PUT @3016 / v1H blob PUT @3100 /
#   DU updateProjectStructure @3003) → 200
#     {"success":true,"entity_id":"<hex24>","entity_type":"doc"|"file"[,"hash"]}
#   wrong file field name → multer LIMIT_UNEXPECTED_FILE → 500 HTML page.
#
# Only the POST verb goes to Go; everything else falls back to Node
# (the GET/PUT surface on this path is Node's 404-page territory).

location ~ ^/Project/[^/]+/upload\z {
  if ($request_method !~ ^(POST)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
