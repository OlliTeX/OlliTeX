# P6.14 — notifications preferences module surface, flipped to the OlliTeX Go
# web (WEB_GO_PLAN.md P6.14). services/web/modules/notifications
# (NotificationsPreferencesRouter.mjs — 7 routes):
#   /notifications/preferences (GET|POST)                     global prefs
#   /notifications/preferences/project/:projectId (GET|POST)  project prefs
#   /user/notification-preferences (GET|POST)                 301 /hub#/mysettings.email
#   /user/send-test-email (POST)                               test mail + {"message":"Email Sent"}
# Method guard on every entry; wrong method/unknown tail falls through to the
# default "location /" → Node.
# [^/]+ for ids (nginx lexer rejects {N} quantifiers) — same as P6.9-P6.13.
location ~ ^/notifications/preferences$ {
  if ($request_method !~ ^(GET|POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location ~ ^/notifications/preferences/project/[^/]+$ {
  if ($request_method !~ ^(GET|POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location ~ ^/user/notification-preferences$ {
  if ($request_method !~ ^(GET|POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location ~ ^/user/send-test-email$ {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
