# WEB_GO_PLAN P3.4 — registration-page leaf flips (OlliTeX Go web).
#
# Routes flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (modules/registration-page/.../RegistrationPageRouter.mjs):
#
#   GET  /register  → ensureRegistrationEnabled → registrationPage (React shell)
#   POST /register  → ensureRegistrationEnabled → rateLimit(5/60) → registerNewUser
#
# The `location = /register` exact match covers both methods on that path.
# Node and Go share the same Mongo/Redis, so the happy-path user/token/mail
# side effects and the postRegister rate-limit bucket are shared state — the
# gate resets both between legs.

location = /register {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
