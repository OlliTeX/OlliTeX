# P6.11 — github-sync module surface, flipped to the OlliTeX Go web
# (WEB_GO_PLAN.md P6.11).
# The github-sync module is NOT registered in this environment
# (GITHUB_SYNC_ENABLED unset — pinned: every route 404s on Node), so the
# parity surface is the shared 404/403/401 chain, which the Go core already
# reproduces byte-for-byte (member mutation w/o csrf → 403 text/plain;
# member w/ token → 404 "Cannot <METHOD> <path>" express page / GET 404
# OlliTeX page; anon GET+json → 401, anon GET bare → 302 /login, anon
# non-GET → 403). The gate battery covers the full declared module surface
# so the cutover is future-safe: after P7 Node retirement these paths are
# answered by Go with the exact same bodies regardless of module state.
# 16 declared routes: user oauth2/oauth2-callback/unlink/status/orgs/repos;
# git-servers (GET|POST), git-servers/:id (DELETE), git-servers/test (POST);
# git-pat/link (POST); project new/github-sync (POST); project
# state (GET) export (POST) merge/overview (GET) merge (POST) and repo
# unlink (DELETE). Wrong method falls through to the default "location /"
# → Node (parity-safe — identical 404 shapes on both stacks).
location = /user/github-sync/oauth2 {
  if ($request_method !~ ^(GET)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location = /user/github-sync/oauth2/callback {
  if ($request_method !~ ^(GET)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
