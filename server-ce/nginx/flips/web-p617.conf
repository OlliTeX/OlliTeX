# P6.17 — tex-autoformatter module surface, flipped to the OlliTeX Go web
# (WEB_GO_PLAN.md P6.17). services/web/modules/tex-autoformatter
# (TexAutoformatterController.mjs — 1 route):
#   /api/format-tex (POST) format .bib (bibtex-tidy) / .tex (tex-fmt)
# Method guard on every entry; wrong method falls through to Node — same as
# the P6.10-P6.16 confs.

location = /api/format-tex {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
