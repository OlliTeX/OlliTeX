# WEB_GO_PLAN P6.3b — admin-tools (user surface, mutations) flip (OlliTeX Go web).
#
# Server surface of services/web/modules/admin-tools (UserListController
# .mjs, ensureUserIsSiteAdmin), live-pinned 2026-09-16 (/tmp/p63b_node.json):
#   POST   /admin/user/create                  (register + admin extras + activation mail)
#   POST   /admin/user/:userId/send-activation (activation token + mail)
#   POST   /admin/user/:userId/update          (name / email / canManageTemplates)
#   POST   /admin/user/:userId/delete          (soft delete: audit + deletedUsers + projects)
#   POST   /admin/user/:userId/restore         (re-insert from deletedUsers + undelete owned)
#   DELETE /admin/user/:userId                 (purge/redact the deletedUsers record)
#
# Method guards keep Node-handled verbs on Node; the Go shadow only owns
# the listed (method, path) pairs.

location = /admin/user/create {
  if ($request_method !~ ^\(POST\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/admin/user/[^/]+/send-activation$ {
  if ($request_method !~ ^\(POST\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
