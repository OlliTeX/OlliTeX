# WEB_GO_PLAN P6.3a — admin-tools (user surface, reads) flip (OlliTeX Go web).
#
# Server surface of services/web/modules/admin-tools (UserListController
# .mjs, ensureUserIsSiteAdmin), live-pinned 2026-09-16 (/tmp/p63a):
#   POST /admin/users               (admin user list: filters + sort)
#   GET  /admin/user/:userId/info   (activationLink + canManageTemplates)
#
# Method guards keep Node-handled verbs on Node; the Go shadow only owns
# the listed (method, path) pairs.

location = /admin/users {
  if ($request_method !~ ^\(POST\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/admin/user/[^/]+/info$ {
  if ($request_method !~ ^\(GET\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
