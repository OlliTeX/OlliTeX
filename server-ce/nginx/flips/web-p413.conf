# WEB_GO_PLAN P4.12c — private API document trio flip (OlliTeX Go web).
#
# Oracle (services/web, api profile on 127.0.0.1:3000 — the canonical
# private-API surface; the Node WEB profile on 4000 has NO doc trio
# routes):
#   router.mjs — privateApiRouter (mounted when the 'api' service is
#     enabled): GET|POST /project/:Project_id/doc/:doc_id and
#     POST /project/:Project_id/doc/:doc_id/changes/reject, each guarded
#     by requirePrivateApiAuth (HTTP basic auth — WEB_API_USER /
#     WEB_API_PASSWORD, baked into /etc/overleaf/settings.js at image
#     build; challenge scheme "OverleafLogin").
#   DocumentController.mjs — getDocument (docstore GET + chat
#     resolved-thread-ids GET → pinned key-order JSON; ?plain=1 → text;
#     ghost doc/project → 404 "Not Found"; bad oid → 404 validation JSON);
#     setDocument (zod body VA {lines,version,ranges} → docstore POST →
#     {"rev":N} / {"rev":N,"modified":true}); trackChangesRejected (CE
#     no-op hook → 204).
#
# Coverage split between flips:
#   * GET|POST|DELETE /project/{pid}/doc/{did} are ALREADY claimed by
#     web-p411b.conf (non-DELETE → Go; DELETE → Go) — the Go docapi
#     handlers now answer the GET|POST verbs there, so THIS file only
#     needs the reject path.
#   * POST /project/{pid}/doc/{did}/changes/reject → Go (new), other
#     verbs fall back to Node.
#
# The flip changes the nginx-bound surface from the web-profile gate
# mixture (302-login / CSRF-403 / 404 page) to the real private-API
# contract — that IS the cutover.

location ~ ^/project/[^/]+/doc/[^/]+/changes/reject\z {
  if ($request_method !~ ^(POST)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
