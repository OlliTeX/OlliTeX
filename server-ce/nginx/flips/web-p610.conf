# P6.10 — dropbox module surface, flipped to the OlliTeX Go web (WEB_GO_PLAN.md P6.10).
# 11 routes: user status/connect/disconnect/oauth2/oauth-callback; project
# state(GET|DELETE)/link/pull/push/files; new-from-dropbox. Method guard on
# every entry; wrong method/unknown subpath falls through to the default
# "location /" → Node (the pinned battery covers the full module surface).
# Project id = [^/]+ (Go handler regex parity; nginx lexer rejects {N}
# quantifiers). The Go/Node requireLogin chain is identical: anon GET+accept-
# json → 401, GET no-json → 302 /login, non-GET → 403 — covered by the gate's
# anon pins.
location = /user/dropbox/status {
  if ($request_method !~ ^(GET)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location = /user/dropbox/connect {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
