# member project routes (state GET is login-only in Node — no authz; the rest
# run ensureUserCanWriteProjectContent inside Go)
location ~ ^/project/[^/]+/dropbox/state$ {
  if ($request_method !~ ^(GET|DELETE)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
