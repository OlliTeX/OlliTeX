# WEB_GO_PLAN P4.1 — project list flip (OlliTeX Go web).
#
# Route flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (router.mjs:541 + Features/Project/ProjectController.userProjectsJson):
#
#   GET /user/projects  → requireLogin → { projects: [ {_id, name, accessLevel} ] }
#
# Node and Go share Mongo (projects/users) + Redis (session), so the auth
# session is shared state — the gate uses one logged-in session per leg and
# diffs the Node baseline against the flipped Go response byte-for-byte.

location = /user/projects {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
