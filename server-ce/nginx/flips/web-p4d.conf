# WEB_GO_PLAN P4.4 — access-requests flip (OlliTeX Go web).
#
# Route flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (CollaboratorsRouter + CollaboratorsController.getAccessRequests +
# CollaboratorsGetter.ProjectAccess.loadAccessRequestsView):
#
#   GET /project/:Project_id/access-requests
#       → requireLogin → ensureUserCanAdminProject (OWNER or site-admin w/
#         'modify-project-setting'; ADMIN_PRIVILEGE_AVAILABLE=true here → owner||isAdmin)
#       → { editAccessRequests: [ {_id, email, first_name, last_name,
#                                  privilegeLevel, currentPrivilegeLevel,
#                                  requestedAt} ] }
#
# The project id is a dynamic single path segment (the rest is the literal
# "access-requests"), so this is a REGEX location mirroring Node's
# `:Project_id` — the empty-id URL does NOT match and falls through to Node.
# Node and Go share Mongo (projects/users) + Redis (session), so the auth
# session is shared state — the gate uses one logged-in session per leg.

location ~ ^/project/[^/]+/access-requests\z {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
