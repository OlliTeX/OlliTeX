# P6.20 — launchpad module surface (first-admin bootstrap), flipped to the OlliTeX Go web
# (WEB_GO_PLAN.md P6.20, the last P6 flip). 5 routes: the launchpad page plus the
# register_admin / register_ldap_admin / register_saml_admin / send_test_email POSTs.
# Method guard on every entry; wrong method falls through to "location /" → Node
# (unobservable divergence — same shape as the Node route in either world; the pinned
# battery covers the module surface). Oracle + byte-parity bake:
# go/services/web/views/pages_data_p620.go + go/services/web/features/launchpad.
location = /launchpad {
  if ($request_method !~ ^(GET)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location = /launchpad/register_admin {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
