# WEB_GO_PLAN P6.2 — admin-tools (project surface) flip (OlliTeX Go web).
#
# Server surface of services/web/modules/admin-tools (AdminToolsRouter
# .mjs, ensureUserIsSiteAdmin), live-pinned 2026-09-16 (/tmp/p62):
#   legacy 301s, active-projects, per-user listing (active+deleted),
#   trash/untrash, soft delete / undelete / purge, members, invites
#   (list/create/revoke/resend), user-level put/del, sharing-link get/set.
#
# Method guards keep Node-handled verbs on Node; the Go shadow only owns
# the listed (method, path) pairs.

location = /admin/user {
  if ($request_method !~ ^\(GET\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

