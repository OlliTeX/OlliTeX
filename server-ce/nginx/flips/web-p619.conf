# P6.19 — git-bridge web module surface, flipped to the OlliTeX Go web
# (WEB_GO_PLAN.md P6.19). services/web/modules/git-bridge, routes served by
# the Node `web` profile (the nginx plane):
#   GET    /oauth/token/info                     (publicApi; PAT validation;
#                                                  rate limit 30/60s)
#   GET    /git-bridge/personal-access-tokens    (webRouter; requireLogin)
#   POST   /git-bridge/personal-access-tokens    (webRouter; requireLogin)
#   DELETE /git-bridge/personal-access-tokens/:token_id (webRouter)
#
# The docs-API half of the module (GET /api/v0/docs/:p, saved_vers,
# snapshots/:v, POST snapshots) is served by Node on the `web-api` profile
# (127.0.0.1:3000), which the e2e nginx plane does NOT route (location /
# → 4000; the bridge reaches :3000 directly). Both stacks have been A/B'd
# directly on that half, 2026-09-20: 18-case HTTP battery zero-diff incl.
# deep-push parity (accepted → postback {code:upToDate,latestVerId} →
# entity swap main.tex→parity.txt → hash-based v1-history versions →
# atts-based GET snapshots). This gate pins the nginx-served surface.
#
# Method guards on every entry (P6.10+ pattern): wrong method falls
# through to Node. The token_id DELETE route is a regex location; ids that
# are not 24-hex fall through to Node on every leg (parity by
# construction).

location = /oauth/token/info {
  if ($request_method !~ ^(GET)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}

location = /git-bridge/personal-access-tokens {
  if ($request_method !~ ^(GET|POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}

location ~ "^/git-bridge/personal-access-tokens/[0-9a-fA-F]{24}$" {
  if ($request_method !~ ^(DELETE)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
