# WEB_GO_PLAN P6.8 — mendeley reference-provider module surface flip
# (OlliTeX Go web).
#
# Server surface of services/web/modules/mendeley (MendeleyRouter.mjs +
# MendeleyController.mjs + MendeleyApiClient.mjs):
#   GET  /user/mendeley/status          (configured/connected JSON)
#   GET  /mendeley/groups               (create-file modal groups)
#   GET  /user/mendeley/oauth           (OAuth2 authorize redirect)
#   GET  /user/mendeley/oauth/callback  (code→token exchange redirect)
#   POST /mendeley/unlink               ($unset refProviders.mendeley)
#
# Live-pinned 2026-09-17 (direct dual-stack, byte-identical) in the
# e2e-UNCONFIGURED phase (no MENDELEY_* env, site_settings.mendeley unset,
# user unlinked → NO api.mendeley.com traffic on the gate paths):
#   status   → 200 application/json {"configured":false,"connected":false}
#   groups   → 403 {"error":"not_configured","message":"mendeley_groups_relink"}
#   oauth    → 302 Location /hub#mysettings.references (empty body, Vary: Accept)
#   callback → 302 /hub#mysettings.references (every path)
#   unlink   → 200 text/plain OK
#
# Method guards keep Node-handled verbs on Node (the POST guard pins the
# unlink route to Go only for POST; every other verb goes to Node).

location = /user/mendeley/status {
  if ($request_method !~ ^\(GET\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /mendeley/groups {
  if ($request_method !~ ^\(GET\)$) {
