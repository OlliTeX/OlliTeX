# P6.12 — track-changes module surface, flipped to the OlliTeX Go web (WEB_GO_PLAN.md P6.12).
# 11 routes under /project/:project_id/...:
#   track_changes (POST)              read authz  + writes limiter
#   doc/:id/changes/accept (POST)     write authz + writes limiter
#   ranges (GET) / changes/users (GET)/ threads (GET)          read authz + reads limiter
#   thread/:tid/messages (POST)                               read authz + reads limiter
#   thread/:tid/messages/:mid (edit POST | DELETE)            read authz + reads limiter
#   doc/:id/thread/:tid resolve (POST) / reopen (POST)        read authz + reads limiter
#   doc/:id/thread/:tid (DELETE)                              write authz + writes limiter
# Method guard on every entry; wrong method/unknown subpath falls through to the
# default "location /" → Node (the pinned battery covers the full surface, incl.
# the ghost 500-page paths and the shared read/write authz chain).
# [^/]+ for ids (nginx lexer rejects {N} quantifiers) — same as P6.9/P6.10.
location ~ ^/project/[^/]+/track_changes$ {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location ~ ^/project/[^/]+/doc/[^/]+/changes/accept$ {
