# WEB_GO_PLAN P5.1a — editor page flip (OlliTeX Go web).
#
# Routes flipped to the Go shadow (127.0.0.1:4010), pinned by the source:
#
#   GET /editor/:Project_id                              (ProjectController.loadEditor)
#   GET /Project/:Project_id                             (legacy, same controller)
#   GET /editor/:Project_id/:detachRole(detacher|detached)
#   GET /Project/:Project_id/:detachRole(detacher|detached)
#
# Node pipeline (router.mjs ~590-640, pinned):
#   openProjectRateLimiter (NO-OP when Settings.disableRateLimits, which the
#   e2e stack sets) → useCapabilities → ensureUserCanReadProject (requireLogin
#   → 302 /login for anon; 401/403 for no-read) → ProjectController.loadEditor
#   → res.render('project/ide-react' | 'project/ide-react-detached', locals)
#
# Go and Node share Mongo (users/projects) + Redis (session) so ONE logged-in
# session drives both legs; the gate diffs Node baseline vs flipped Go output
# byte-for-byte (same user+project, same csrf, differing only by per-page
# nonce which the renderer generates per request and the gate normalizes).
#
# ONLY the GET verb on these EXACT project-id routes goes to Go. Every other
# verb AND every /Project/:id/… sub-route (file, doc, compile, entities,
# members, …) STAYS on Node (4000).

# editor legacy + new prefixes, MAIN SHELL only (P5.1a scope).
# NOTE: the regex is QUOTED — nginx's config tokenizer treats unquoted {
# } as token delimiters, so "...{24}..." is mandatory here.
#
# The :detachRole (detacher|detached) variants are P5.1b and STAY on Node:
# they render a different template (ide-react-detached), so flipping them
# to the P5.1a main-shell Go page would be a regression. Only the exact
# /editor/<hex24> and /Project/<hex24> main shells are flipped here.
location ~ "^/(editor|Project)/[0-9a-f]{24}\z" {
  if ($request_method !~ ^(GET|HEAD)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
