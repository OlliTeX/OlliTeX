# WEB_GO_PLAN P3.2 — instance-stats leaf flips (OlliTeX Go web).
#
# Routes flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (modules/instance-stats/app/src/InstanceStatsRouter.mjs — webRouter):
#
#   GET  /admin/instance-stats
#   GET  /admin/instance-stats/api/series
#   GET  /admin/instance-stats/api/alert-config
#   PUT  /admin/instance-stats/api/alert-config
#   POST /admin/instance-stats/api/send-test-alert-email
#
# The privateApiRouter route /internal/collect-instance-stats (api profile,
# cron collector) is NOT flipped here — it stays with the Node api process
# until the Go api profile phase.
#
# Exact locations match path only; other methods on these paths get the
# identical Express "Cannot <METHOD> <path>" 404 from both stacks (Go core
# fallback renders the same page).

location = /admin/instance-stats {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /admin/instance-stats/api/series {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /admin/instance-stats/api/alert-config {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /admin/instance-stats/api/send-test-alert-email {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
