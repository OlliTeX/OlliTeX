# ============================================================================
# OlliTeX edge — HAProxy (default reverse proxy, owner 2026-09-28)
#
# Replaces the former nginx edge (compose_cep/nginx). HAProxy is Overleaf's
# own documented load balancer for horizontal scaling (persistent routing),
# exactly what this box needs when going 1 -> N app instances.
#
# Parity with the retired nginx.conf:
#   :80      -> https 301 redirect, EXCEPT /.well-known/acme-challenge/
#              (certbot webroot; proxied to the app container, whose in-image
#               nginx serves /var/www/acme — see overleaf.conf.template)
#   :443     -> TLS termination (single PEM = key+chain, combined at entrypoint
#              from the existing privkey.pem + fullchain.pem mounts)
#              HSTS, Server header hidden, WebSocket tunnel 10m (>= old 3m)
#   cache    -> /static/svgedit/       => Cache-Control: no-cache, must-revalidate
#              hashed assets (suffix list) => Cache-Control passthrough
#              everything else (docs)  => Cache-Control: no-store
#   ws       -> Upgrade/Connection pass-through (native, no special headers)
#   upload   -> nginx edge had client_max_body_size 50M; the in-image nginx
#              still enforces upload limits per location, so HAProxy (which has
#              no body cap) does not weaken the guard
#   bonus    -> stick-table source-IP stickiness = Overleaf's "persistent
#              routing"; switch to sticky COOKIES (see README) if the LB sits
#              behind NAT / a changing client IP
#
# Cert: haproxy needs ONE pem = key then chain. Composed at container start:
#   cat privkey.pem fullchain.pem > /tmp/edge.crt   (see compose command)
# ============================================================================

global
    log stdout format raw local0
    maxconn 4096   # ~ former 4 workers x 768 connections
    ssl-default-bind-options prefer-client-ciphers no-tls-tickets

defaults
    mode http
    log global
    option httplog
    timeout connect      30s
    timeout client       180s
    timeout server       180s
    timeout tunnel       10m    # WebSockets (real-time / socket.io / collab)
    timeout http-request 10s
    option dontlognull

# --- :80 — redirect to HTTPS; pass the ACME webroot through to the app ------
frontend http_front
    bind :80
    acl is_acme path_beg /.well-known/acme-challenge/
    http-request redirect location https://%[req.hdr(host)]%[path] unless is_acme
    http-request set-header X-Forwarded-Proto http if is_acme
    default_backend app

# --- :443 — TLS termination --------------------------------------------------
frontend https_front
    bind :443 ssl crt /tmp/edge.crt
    http-request set-header X-Forwarded-Proto https
    default_backend app

# --- app backend (+ sticky routing per Overleaf's HA requirements) ----------
backend app
    stick-table type ip size 200k expire 30m
    stick type source

    # request-side parity (host + X-Forwarded-For; proto already set upstream)
    http-request set-header Host %[req.hdr(host)]
    http-request set-header X-Forwarded-For %[src]

    # response-side parity (HSTS, hide server, three-tier cache policy)
    http-response add-header Strict-Transport-Security "max-age=31536000; includeSubdomains;"
    http-response del-header Server
    acl is_svgedit path_beg /static/svgedit/
    acl is_wk      url_end -i .js .mjs .css .map .woff2 .woff .ttf .eot .otf .svg .png .jpe .jpeg .webp .gif .ico .json .txt .webmanifest .mp4 .webm .mp3 .wasm
    http-response del-header Cache-Control if is_svgedit
    http-response set-header Cache-Control "no-cache, must-revalidate" if is_svgedit
    http-response del-header Cache-Control if !is_svgedit !is_wk
    http-response set-header Cache-Control "no-store" if !is_svgedit !is_wk

    server app overleafserver:80 check inter 30s fall 3 rise 2
