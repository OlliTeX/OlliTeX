# Functional matrix — legacy /templates/manage (parity scope page)
# Roles: admin + template admin (canManageTemplates) = full; user = denied.
# Template fixture: e2e import of a bundle (template.json+source.zip+output.pdf)
# creates "Parity Fixture Template"; tests use throwaway imports + cleanup.
page: /templates/manage   # retired 2026-09-16 (owner item 7); 2026-11-16: 301→hub-hash ALSO retired (hub hashes dead); live: anon 302 /login, in-session 404
id: templates-manage
roles:
  admin: full
  tpladmin: full
  user: denied

files:
  legacy: specs/parity/legacy-templates-manage.test.e2e.ts
  hub: specs/parity/hub-templates-manage.test.e2e.ts

features:
  - id: redirects
    kind: page
    desc: RETIRED (owner item 7; 2026-11-16 drift re-pin): route is gone — anon 302/login, in-session 404; the management surface lives at /admin-settings/site.general.managetpl (still 200 + live)
    legacy_test: redirects
    hub_test: renders

  - id: denied
    kind: access
    desc: plain user denied the management API (legacy route itself gone for everyone)
    legacy_test: denied
    hub_test: deny

  - id: list
    kind: table
    desc: admin template list (name/version/owner)
    behavior: { endpoint: GET /api/templates/admin-list }
    legacy_test: list
    hub_test: renders

  - id: import
    kind: button
    where: import bundle (file)
    modal: ["Import template bundle (L1)"]
    desc: import a bundle zip; 409 on name conflict with override
    behavior:
      endpoint: POST /template/bundle/import
      payload: { data: base64(zip[template.json,source.zip,output.pdf]), override }
    legacy_test: import
    hub_test: import

  - id: import-url
    kind: button
    where: import from URL
    description: URL import with SSRF guard (internal URLs rejected)
    behavior:
      endpoint: POST /template/bundle/import-url
      payload: { url, override }
    legacy_test: import
    hub_test: import

  - id: edit
    kind: button
    where: template row "Edit"
    modal: ["Edit template (L1)"]
    behavior: { endpoint: POST /template/:id/edit, payload: { name?, description? } }
    legacy_test: edit
    hub_test: edit

  - id: delete
    kind: button
    where: template row "Delete"
    modal: ["Confirm (L1)"]
    behavior: { endpoint: DELETE /template/:id/delete }
    legacy_test: delete
    hub_test: delete

  - id: categories
    kind: form
    where: gallery section (enable + categories)
    desc: enable template gallery + manage enabled categories
    behavior:
      - { endpoint: PUT /admin/site-settings/templates, payload: { enabled, categories } }
      - { endpoint: GET /api/template/categories }
    legacy_test: categories
    hub_test: categories
