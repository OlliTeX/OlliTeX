# Functional matrix — legacy /templates (gallery) — owner list "templates"
# Roles: gallery requires login (CE default: guests see a login prompt);
#   any logged-in user can browse + start projects from templates.
# 2026-09-16 (owner items 7+9): the legacy PAGES are retired — /templates
#   [/:category] and /template/:id now 301-redirect to /hub#/templates.all
#   (see redirects feature). The functional contract survives on the API
#   surface the hub gallery uses:
#   GET  /api/templates[?by=&order=&category=]   → { templates: [{id,version,name,author,description,category,lastUpdated}] }
#   GET  /api/template/categories                 → [{key,name}]
#   GET  /template/:id/preview[?style=thumbnail]  → PDF / PNG thumbnail
#   GET  /template/:id/bundle                     → zip bundle (all signed-in users)
#   POST /project/new { projectName, template }   → project created from template
# Fixture: "Parity Fixture Template" imported via /template/bundle/import
# (see templates-manage specs).
page: /templates
id: templates
roles:
  admin: full
  tpladmin: full
  user: full
  guest: login-prompt   # the hub behind the redirects enforces login

files:
  legacy: specs/parity/legacy-templates-gallery.test.e2e.ts
  hub: specs/parity/hub-templates-gallery.test.e2e.ts

features:
  - id: redirects
    kind: page
    desc: RETIRED (owner items 7+9): /templates[/:category] and /template/:id 301 → /hub#/templates.all
    legacy_test: redirects
    hub_test: renders

  - id: gate
    kind: access
    desc: guest sees a login prompt, not template content
    legacy_test: gate
    hub_test: deny

  - id: list
    kind: table
    desc: JSON listing with id/version/name/author/category
    behavior: { endpoint: GET /api/templates }
    legacy_test: list
    hub_test: list

  - id: use-card
    kind: card
    desc: hub card: "Use template" + "View PDF" + thumbnail + "Download bundle"
    behavior:
      - { endpoint: GET /template/:id/preview?style=thumbnail, note: "PNG" }
      - { endpoint: GET /template/:id/preview, note: "PDF" }
      - { endpoint: GET /template/:id/bundle, note: "zip; all signed-in users since 8b" }
    legacy_test: detail
    hub_test: detail
  - id: detail
    kind: page
    desc: (legacy /template/:id — retired; 301 → hub gallery; success surface = the hub card)
    behavior: { endpoint: GET /template/:id, note: "301" }
    legacy_test: redirects
    hub_test: renders

  - id: use
    kind: button
    where: detail / card "use" action
    modal: ["Name the new project (L1)"]
    desc: starting a project from the template creates it (POST /project/new {projectName, template})
    behavior:
      - { endpoint: POST /project/new, payload: { projectName, template } }
      - { mongo: 'db.projects — new project exists with template origin' }
    legacy_test: use
    hub_test: use

  - id: categories
    kind: nav
    desc: enabled categories listed; category filter narrows the gallery
    behavior:
      - { endpoint: GET /api/template/categories }
      - { endpoint: GET /api/templates?category=<key> }
    legacy_test: categories
    hub_test: categories
