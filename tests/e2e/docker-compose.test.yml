# Disposable e2e test stack — the ONLY server the e2e suite runs against
# (owner decision 2026-09-05: never the production box).
#
# Mirrors the known-good production recipe (compose_cep) with test overrides:
#  - fresh mongo (replica set, like upstream develop) + redis sidecars
#  - plain HTTP on 127.0.0.1:7420 (no nginx/TLS, no cookie-secure)
#  - bootstrap secrets generated per stack into .env.test (gitignored)
#  - LLM / git-bridge / webdav / dropbox / zotero / languagetool enabled so
#    the admin-site + BYO + sync specs exercise the real module paths
#  - texlive compile works via the host docker socket (same as production)
name: ol-e2e

services:
  mongo:
    # 2026-09-16 (owner task T9): same DB as prod (mongo 8.3). Fresh 8.x used
    # to segfault on this host's kernel (SERVER-121912 / SHSTK) — the fix is
    # the GLIBC hwcaps workaround the toolkit already uses for the prod
    # mongo (toolkit/lib/docker-compose.mongo.yml). Data volume is
    # disposable: stack-reset + reseed after the bump.
    image: mongo:8.3
    environment:
      GLIBC_TUNABLES: glibc.cpu.hwcaps=-SHSTK
    command: --replSet overleaf
    volumes:
      - mongo-data:/data/db
      # in-repo fixture (this tree lacks bin/shared; upstream equivalent)
      - ./stack/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js:ro
    # healthy = queryable as PRIMARY (not just process-up)
    healthcheck:
      test: ['CMD', 'mongosh', '127.0.0.1:27017/--quiet', '--eval', 'db.hello().isWritablePrimary ? 1 : 3']
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s
    extra_hosts:
      - 'mongo:127.0.0.1'
    networks: [e2e]

  redis:
    image: redis:8.6-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [e2e]

  # 2026-09-16 (owner task T5): free in-stack SMTP relay + capture API.
  # Zero registry pulls (Mailpit image unreachable from this box): a
  # zero-dependency Node sink on the local overleaf node image (node 24).
  # SMTP :1025 (in-network, no auth) · API :8025 → 127.0.0.1:18025 for the
  # smtp-capture spec.
  smtpsink:
    image: ${OVERLEAF_IMAGE:-ollitex/ollitex:main}
    # env -u NODE_OPTIONS: the overleaf image preloads its Yarn PnP hooks
    # (--require .pnp.cjs / --import .pnp.register.mjs), which breaks running
    # a standalone CJS script; the sink needs none of them.
    entrypoint: ['env', '-u', 'NODE_OPTIONS', 'node']
    command: ['/sink/smtp-sink.js']
    environment:
      SINK_SMTP_PORT: '1025'
      SINK_API_PORT: '8025'
    volumes:
      - ./tools/smtp-sink.js:/sink/smtp-sink.js:ro
    ports:
      - '127.0.0.1:18025:8025'
    networks: [e2e]

  overleaf:
    image: ${OVERLEAF_IMAGE:-ollitex/ollitex:main}
    hostname: overleaf
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sw-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:7420:80'
    environment:
      # ---- bootstrap secrets (stack-generated, .env.test) ----
      CRYPTO_RANDOM: ${CRYPTO_RANDOM}
      WEB_API_PASSWORD: ${WEB_API_PASSWORD}
      SHARED_SERVICE_TOKEN: ${SHARED_SERVICE_TOKEN}
      # clsi_typst sandbox dirs (scoping: only the clsi_typst runit service
      # reads these; the tex clsi is untouched)
      TYPST_COMPILES_DIR: /data_1/image_mining/the_diff/overleaf/tests/e2e/local-data/typst/compiles
      TYPST_OUTPUT_DIR: /data_1/image_mining/the_diff/overleaf/tests/e2e/local-data/typst/output
      # 2026-09-16 (owner #10): tex compiles are SANDBOX-MANDATORY (clsi
      # DockerRunner; LocalCommandRunner removed). SAME-PATH contract: the
      # texlive/texlive:latest-full image (uid 33) bind-mounts these host
      # dirs at the identical container paths.
      # 2026-09 (PDF-404 root fix): the image's baked clsi-nginx.conf serves
      # compile OUTPUT from root /var/lib/overleaf/data/output/<pid>-<uid>/
      # generated-files/<buildId>/ — so the sandbox OUTPUT path MUST be exactly
      # that path (the reference deployments all use it; our local-data/* path
      # made every editor PDF + template-bundle PDF 404 in this stack).
      # Same-path bind keeps the docker-daemon (host) contract intact.
      SANDBOXED_COMPILES_HOST_DIR_COMPILES: /var/lib/overleaf/data/compiles
      SANDBOXED_COMPILES_HOST_DIR_CACHE: /var/lib/overleaf/data/cache
      SANDBOXED_COMPILES_HOST_DIR_OUTPUT: /var/lib/overleaf/data/output
      # python-runner module: test stack exercises it (CE flag via
      # splitTestOverrides; see settings.defaults.js 'overleaf-code')
      ENABLE_PYTHON_RUNNER: 'true'
      OT_JWT_AUTH_KEY: ${OT_JWT_AUTH_KEY}
      OVERLEAF_SESSION_SECRET: ${OVERLEAF_SESSION_SECRET}
      OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET}
      # test-stack only: allow the mongo floor check (prod default unchanged;
      # see check-mongodb.mjs)
      OL_MIN_MONGO_VERSION: '6.0'
      OL_MIN_MONGO_FCV: '6.0'
      # 2026-09-16 (owner task T5): local SMTP relay (Mailpit) — NO paid
      # service. Wires the app EmailSender (password-reset/invitations/
      # registration mails); the hub "test e-mail" button resolves the same
      # values via the site-settings email fallback. Verify spec:
      # specs/parity/smtp-capture.test.e2e.ts (sink API on 127.0.0.1:18025).
      OVERLEAF_EMAIL_FROM_ADDRESS: 'OlliTeX <noreply@e2e.test>'
      OVERLEAF_EMAIL_DRIVER: smtp
      OVERLEAF_EMAIL_SMTP_HOST: smtpsink
      OVERLEAF_EMAIL_SMTP_PORT: '1025'
      OVERLEAF_EMAIL_SMTP_SECURE: 'false'
      # 2026-09 (mega-batch): SP public cert for SAML SP-signing metadata
      # (the app reads the path at request time; test-only fixture keypair).
      OVERLEAF_SAML_PUBLIC_CERT: /e2e-saml/sp-cert.pem
      # Template gallery: admin-managed, but the e2e stack must default to ON
      # so the template parity specs (managetpl, gallery) have a live API on
      # every fresh stack (stored sections can override at test time).
      OVERLEAF_TEMPLATE_GALLERY: 'true'
      # Disposable test stack: the e2e suite + seed + manual probes share one
      # source IP and CE's login limiter (20/min/IP) throttles legitimate
      # test logins mid-run. This ONLY affects the test stack — the core
      # default (rate limiting ON) is untouched for real deployments.
      OVERLEAF_DISABLE_RATE_LIMITS: 'true'
      LLM_KEY_SECRET: ${LLM_KEY_SECRET}
      # internal service auth (history-v1 requires these under NODE_ENV=production;
      # project-history & web authenticate with the same values)
      STAGING_PASSWORD: ${SHARED_SERVICE_TOKEN}
      V1_HISTORY_PASSWORD: ${SHARED_SERVICE_TOKEN}
      OT_JWT_AUTH_ALG: HS256
      # P2 contract: the "Request edit access" toolbar flow (readOnly members)
      SHARING_UPDATES_ENABLED: 'true'
      MONGO_CONNECTION_STRING: mongodb://mongo:27017/sharelatex?replicaSet=overleaf
      # check-mongodb/redis.mjs scripts (my_init gate) read the toolkit-style names —
      # point them at the e2e services (2026-10-04; env-chain fix in the scripts follows)
      MONGO_URL: mongodb://mongo:27017/sharelatex?replicaSet=overleaf
      REDIS_URL: redis://redis:6379/0
      # ---- DB / infra ----
      OVERLEAF_MONGO_URL: mongodb://mongo:27017/sharelatex?replicaSet=overleaf
      REDIS_HOST: redis
      OVERLEAF_REDIS_HOST: redis
      OVERLEAF_FILESTORE_MIGRATION_LEVEL: '2'
      # ---- PG plane (G1, 2026-09-27 owner: tree-wide anchor postgres:18-alpine) ----
      # history-v1 (Node knex) + future Go history-v1 port connect via this;
      # migrations run at boot (server-ce init 890).
      DATABASE_URL: postgres://overleaf:overleaf@postgres:5432/overleaf-history-v1
      # ---- S3 plane (G2/STOR-1: SeaweedFS = the only durable binary backend) ----
      # Bucket names are PLAIN (Go s3x PathEscapes the bucket; a "/buckets/x"
      # name would mis-route). Node persistor keys map onto the same buckets.
      OVERLEAF_FILESTORE_BACKEND: s3
      OVERLEAF_FILESTORE_S3_ENDPOINT: http://s3:8333
      OVERLEAF_FILESTORE_S3_PATH_STYLE: 'true'
      OVERLEAF_FILESTORE_S3_ACCESS_KEY_ID: e2e
      OVERLEAF_FILESTORE_S3_SECRET_ACCESS_KEY: e2e-secret
      OVERLEAF_FILESTORE_TEMPLATE_FILES_BUCKET_NAME: templatefiles
      OVERLEAF_HISTORY_PROJECT_BLOBS_BUCKET: projectblobs
      OVERLEAF_HISTORY_BLOBS_BUCKET: globalblobs
      # monolith history-v1 persistor (server-ce custom-env mapping:
      # persistor.backend <- OVERLEAF_HISTORY_BACKEND etc.)
      OVERLEAF_HISTORY_BACKEND: s3
      OVERLEAF_HISTORY_S3_ENDPOINT: http://s3:8333
      OVERLEAF_HISTORY_S3_PATH_STYLE: 'true'
      OVERLEAF_HISTORY_S3_ACCESS_KEY_ID: e2e
      OVERLEAF_HISTORY_S3_SECRET_ACCESS_KEY: e2e-secret
      OVERLEAF_HISTORY_CHUNKS_BUCKET: chunks
      OVERLEAF_HISTORY_ZIPS_BUCKET: zips
      PERSISTOR_BACKEND: s3
      # docstore (G2 STOR-1: S3-only archive; fs retired — see cmd/docstore/main.go)
      BACKEND: s3
      BUCKET_NAME: docstore-archive
      # H1 flip: Go history-v1 owns :3100 (Node history-v1 stands down)
      HISTORY_V1_GO: "1"
      # PH flip: Go project-history owns :3054 (Node project-history stands down)
      PROJECT_HISTORY_GO: "1"
      AWS_S3_ENDPOINT: http://s3:8333
      AWS_S3_PATH_STYLE: 'true'
      AWS_ACCESS_KEY_ID: e2e
      AWS_SECRET_ACCESS_KEY: e2e-secret
      OVERLEAF_EDITOR_ANALYTICS_BUCKET: analytics
      OVERLEAF_EDITOR_BLOBS_BUCKET: globalblobs
      OVERLEAF_EDITOR_CHUNKS_BUCKET: chunks
      OVERLEAF_EDITOR_PROJECT_BLOBS_BUCKET: projectblobs
      OVERLEAF_EDITOR_ZIPS_BUCKET: zips
      # ---- plain-HTTP test surface (no proxy) ----
      OVERLEAF_BEHIND_PROXY: 'false'
      OVERLEAF_SITE_URL: http://127.0.0.1:7420
      # the registration domain gate treats an EMPTY list as "block all"
      # (CE quirk: `allowedDomains && !list.some(...)` with `[]` truthy) —
      # allow the fixture domain explicitly:
      OVERLEAF_ALLOWED_REGISTRATION_EMAIL_DOMAINS: e2e.test
      PUBLIC_URL: http://127.0.0.1:7420
      # ---- ext module gates (module paths exercised by the specs) ----
      LLM_ENABLED: 'true'
      LLM_ALLOW_USER_SETTINGS: 'true'
      GIT_BRIDGE_ENABLED: 'true'
      GIT_BRIDGE_HOST: git-bridge
      WEBDAV_ENABLED: 'true'
      DROPBOX_ENABLED: 'true'
      LANGUAGE_TOOL_URL: http://languagetool:8010
      ZOTERO_CLIENT_KEY: e2e-dummy-client-key
      ZOTERO_CLIENT_SECRET: e2e-dummy-client-secret
      GITHUBINTERFACE_WORKDIR_ROOT: /var/lib/overleaf/ghif  # 2026-09-29: legacy shared-workdir constant (in-container githubinterface retired with the TPDS->web merge; kept for env-diff parity)
      LOG_LEVEL: info
    volumes:
      - ol-data:/var/lib/overleaf
      # 2026-09 (mega-batch): test-only SAML SP cert (OVERLEAF_SAML_PUBLIC_CERT)
      - ./fixtures/saml/sp-cert.pem:/e2e-saml/sp-cert.pem:ro
      # 2026-09-16 (owner #10): clsi sandbox-compile dirs on a HOST path
      # (same-path contract with the compile sibling container; see the
      # note at the bottom of stack/settings.js)
      - ./stack/settings.js:/etc/overleaf/settings.js:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # typst sandbox compile dirs (clsi_typst DockerRunner SAME-PATH
      # contract): host dir bind-mounted at the identical container path so
      # the pinned pandoc/typst image (uid 33) and the overleaf service see
      # the same files (see images/main-amd64/runit/clsi_typst-overleaf/run)
      - ./local-data/typst/compiles:/data_1/image_mining/the_diff/overleaf/tests/e2e/local-data/typst/compiles
      - ./local-data/typst/output:/data_1/image_mining/the_diff/overleaf/tests/e2e/local-data/typst/output
      # 2026-09-16 (owner #10): tex sandbox compile dirs (texlive/texlive:latest-full, uid 33)
      # host dirs created+owned by scripts/stack-reset.sh (uid 33, the texlive image user)
      - /var/lib/overleaf/data/compiles:/var/lib/overleaf/data/compiles
      - /var/lib/overleaf/data/cache:/var/lib/overleaf/data/cache
      - /var/lib/overleaf/data/output:/var/lib/overleaf/data/output
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: bash -c 'curl -fsI --connect-timeout 5 http://localhost/login || exit 1'
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 120s
    networks: [e2e]

  # ---- PG plane (G1, 2026-09-27 owner-pinned image: "14 is dead") ----
  postgres:
    image: postgres:18-alpine
    networks: [e2e]
    environment:
      POSTGRES_USER: overleaf
      POSTGRES_PASSWORD: overleaf
      POSTGRES_DB: overleaf-history-v1
    ports:
      - '127.0.0.1:5432:5432'   # debugging only
    volumes:
      - pg-data:/var/lib/postgresql   # PG18+ layout: mount at /var/lib/postgresql (not /data)
    healthcheck:
      test: pg_isready --host=localhost --quiet
      interval: 1s
      retries: 20

  # ---- SeaweedFS (G2/STOR-1) — 1:1 mirror of the known-good compose_cep
  #      services (chrislusf/seaweedfs:latest; same commands/flags/aliases).
  #      NO host port mappings: the host already runs the production seaweed
  #      on 8333/8888/9333; these are reachable only inside the e2e network.
  sw-master:
    image: chrislusf/seaweedfs:latest
    command: master -ip=master -ip.bind=0.0.0.0 -metricsPort=9327
    volumes:
      - sw-master-data:/data
    networks:
      e2e:
        aliases: [master]
  sw-filer:
    image: chrislusf/seaweedfs:latest
    command: filer -master="master:9333" -ip=filer -ip.bind=0.0.0.0
    volumes:
      - sw-filer-data:/data
    depends_on:
      - sw-master
    networks:
      e2e:
        aliases: [filer]
  sw-volume:
    image: chrislusf/seaweedfs:latest
    command: volume -mserver="master:9333" -ip=volume -ip.bind=0.0.0.0 -port=8080 -dir=/data -max=0
    volumes:
      - sw-volume-data:/data
    depends_on:
      - sw-master
    networks:
      e2e:
        aliases: [volume]
  sw-s3:
    image: chrislusf/seaweedfs:latest
    command: s3 -filer="filer:8888" -ip.bind=0.0.0.0
    depends_on:
      - sw-filer
    networks:
      e2e:
        aliases: [s3]
  # One-shot gate: wait for S3, create the buckets idempotently (S3 PutBucket
  # works on filer-backed SeaweedFS; object PUT to a missing bucket 403s),
  # then overleaf may start (the Go filestore fails fast on missing buckets).
  sw-init:
    image: curlimages/curl:latest
    entrypoint: sh
    command: ["-c", "while :; do if curl -sf -o /dev/null http://s3:8333/; then ok=1; for b in templatefiles projectblobs globalblobs chunks zips analytics; do code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT http://s3:8333/$$b); case $$code in 200|409) : ;; *) ok=0 ;; esac; done; [ $$ok -eq 1 ] && exit 0; fi; sleep 2; done"]
    depends_on:
      - sw-s3
    networks: [e2e]

  git-bridge:

    # P7 cutover (2026-09-24): the 1:1 Go git-bridge (go/services/gitbridge)
    # replaces the Java sharelatex/git-bridge. Image = ollitex/git-bridge
    # (ubuntu:26.04 + git) with the cmd/gitbridge Go binary, config-agnostic. Config is mounted from
    # gitbridge-runtime.json (same schema as the Java runtime.json).
    #   build:    go/services/gitbridge/build.sh   -> ollitex/git-bridge:latest
    #   rollback: image: sharelatex/git-bridge:ext-6.3.0-port
    #             command: ['/server-pro-start.sh']   (revive the Java service)
    image: ollitex/git-bridge:latest
    user: root
    command: ['git_bridge', 'serve', '/conf/runtime.json']
    volumes:
      - ./gitbridge-runtime.json:/conf/runtime.json:ro
      - gb-data:/data/git-bridge
    depends_on:
      - overleaf
    networks: [e2e]

  languagetool:
    image: erikvl87/languagetool:latest
    networks: [e2e]

volumes:
  mongo-data:
  ol-data:
  gb-data:
  pg-data:
  sw-master-data:
  sw-filer-data:
  sw-volume-data:

networks:
  e2e:
