services:
  sharelatex:
    restart: always
    # Server Pro users:
    # image: quay.io/sharelatex/sharelatex-pro
    image: ollitex/ollitex
    container_name: sharelatex
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - 80:80
    stop_grace_period: 60s
    volumes:
      - ~/sharelatex_data:/var/lib/overleaf
      ########################################################################
      ####  Server Pro: Uncomment the following line to mount the docker  ####
      ####             socket, required for Sibling Containers to work    ####
      ########################################################################
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OVERLEAF_APP_NAME: Overleaf Community Edition

      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex

      # Same property, unfortunately with different names in
      # different locations
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis

      # IMPORTANT: Required for invite token generation
      # OVERLEAF_INVITE_TOKEN_SECRET: generate with `openssl rand -base64 32`

      ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file,zotero"

      # Enables Thumbnail generation using ImageMagick
      ENABLE_CONVERSIONS: "true"

      # Disables email confirmation requirement
      EMAIL_CONFIRMATION_DISABLED: "true"

      ## Set for SSL via nginx-proxy
      #VIRTUAL_HOST: 103.112.212.22

      # OVERLEAF_SITE_URL: http://overleaf.example.com
      # OVERLEAF_NAV_TITLE: Overleaf Community Edition
      # OVERLEAF_HEADER_IMAGE_URL: http://example.com/mylogo.png
      # OVERLEAF_ADMIN_EMAIL: support@it.com

      # OVERLEAF_LEFT_FOOTER: '[{"text": "Another page I want to link to can be found <a href=\"here\">here</a>"} ]'
      # OVERLEAF_RIGHT_FOOTER: '[{"text": "Hello I am on the Right"} ]'

      # OVERLEAF_EMAIL_FROM_ADDRESS: "hello@example.com"

      # OVERLEAF_EMAIL_AWS_SES_ACCESS_KEY_ID:
      # OVERLEAF_EMAIL_AWS_SES_SECRET_KEY:

      # OVERLEAF_EMAIL_SMTP_HOST: smtp.example.com
      # OVERLEAF_EMAIL_SMTP_PORT: 587
      # OVERLEAF_EMAIL_SMTP_SECURE: false
      # OVERLEAF_EMAIL_SMTP_USER:
      # OVERLEAF_EMAIL_SMTP_PASS:
      # OVERLEAF_EMAIL_SMTP_TLS_REJECT_UNAUTH: true
      # OVERLEAF_EMAIL_SMTP_IGNORE_TLS: false
      # OVERLEAF_EMAIL_SMTP_NAME: '127.0.0.1'
      # OVERLEAF_EMAIL_SMTP_LOGGER: true
      # OVERLEAF_CUSTOM_EMAIL_FOOTER: "This system is run by department x"

      # ENABLE_CRON_RESOURCE_DELETION: true

      ################
      ## Server Pro ##
      ################

      ## The Community Edition is intended for use in environments where all users are trusted and is not appropriate for
      ## scenarios where isolation of users is required. Sandboxed Compiles are not available in the Community Edition,
      ## so the following environment variables must be commented out to avoid compile issues.
      ##
      ## Sandboxed Compiles: https://docs.overleaf.com/on-premises/configuration/overleaf-toolkit/server-pro-only-configuration/sandboxed-compiles
      SANDBOXED_COMPILES: "true"
      ### Bind-mount source for /var/lib/overleaf/data/compiles inside the container.
      SANDBOXED_COMPILES_HOST_DIR_COMPILES: "/home/user/sharelatex_data/data/compiles"
      ### Bind-mount source for /var/lib/overleaf/data/output inside the container.
      SANDBOXED_COMPILES_HOST_DIR_OUTPUT: "/home/user/sharelatex_data/data/output"
      ### Backwards compatibility (before Server Pro 5.5)
      DOCKER_RUNNER: "true"
      SANDBOXED_COMPILES_SIBLING_CONTAINERS: "true"

      ## Works with test LDAP server shown at bottom of docker compose
      # OVERLEAF_LDAP_URL: 'ldap://ldap:389'
      # OVERLEAF_LDAP_SEARCH_BASE: 'ou=people,dc=planetexpress,dc=com'
      # OVERLEAF_LDAP_SEARCH_FILTER: '(uid={{username}})'
      # OVERLEAF_LDAP_BIND_DN: 'cn=admin,dc=planetexpress,dc=com'
      # OVERLEAF_LDAP_BIND_CREDENTIALS: 'GoodNewsEveryone'
      # OVERLEAF_LDAP_EMAIL_ATT: 'mail'
      # OVERLEAF_LDAP_NAME_ATT: 'cn'
      # OVERLEAF_LDAP_LAST_NAME_ATT: 'sn'
      # OVERLEAF_LDAP_UPDATE_USER_DETAILS_ON_LOGIN: 'true'

      # OVERLEAF_TEMPLATES_USER_ID: "578773160210479700917ee5"
      # OVERLEAF_NEW_PROJECT_TEMPLATE_LINKS: '[ {"name":"All Templates","url":"/templates/all"}]'

      # OVERLEAF_PROXY_LEARN: "true"

  mongo:
    restart: always
    image: mongo:8.0
    container_name: mongo
    command: "--replSet overleaf"
    volumes:
      - ~/mongo_data:/data/db
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      # Required when using the automatic database setup for initializing the replica set.
      # This override is not needed when running the setup after starting up mongo.
      - mongo:127.0.0.1
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    restart: always
    image: redis:6.2
    container_name: redis
    volumes:
      - ~/redis_data:/data

  # ---------------------------------------------------------------------------
  # D22 (8cbc1526) observability — opt-in profile (default `up` is unchanged):
  #
  #   docker compose --profile d22 up -d
  #
  # Prometheus scrapes ALL Go services' /metrics on their internal docker
  # ports (D22 A2 wiring — the HAProxy edge never forwards /metrics);
  # node-exporter reports host-level signals (CPU/RAM/disk via mounted /).
  # :9090 is host-published for Grafana (phase C) / operator tooling.
  # Docs: build-images/prometheus/README.md
  # ---------------------------------------------------------------------------
  prometheus:
    profiles: ["d22"]
    restart: always
    image: prom/prometheus:v2.53.5
    container_name: prometheus
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sed -e 's/__OVERLEAF_HOST__/${OVERLEAF_HOST:-sharelatex}/g' -e 's/__GITBRIDGE_HOST__/${GITBRIDGE_HOST:-git-bridge}/g' /etc/prometheus/prometheus.yml > /tmp/prometheus-live.yml && exec /prometheus/prometheus --config.file=/tmp/prometheus-live.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d --web.enable-lifecycle"
    environment:
      OVERLEAF_HOST: sharelatex
      GITBRIDGE_HOST: git-bridge
    volumes:
      - ./build-images/prometheus:/etc/prometheus:ro  # yml + rules/ (phase D)
      - ~/prometheus_data:/prometheus
    ports:
      - "9090:9090"

  # ---------------------------------------------------------------------------
  # OlliTeX D22 (8cbc1526) — phase D: Alertmanager (alert bridge).
  # Prometheus alerts land here; it webhooks the d22 Go-web alert route
  # (POST /internal/alerts) which fans out mails via the instance-stats
  # alert configuration. No host port (sidecar only; docker-internal).
  # ---------------------------------------------------------------------------
  alertmanager:
    profiles: ["d22"]
    restart: always
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sed -e 's/__OVERLEAF_HOST__/${OVERLEAF_HOST:-sharelatex}/g' /etc/alertmanager/alertmanager.yml > /tmp/am-live.yml && exec /bin/alertmanager --config.file=/tmp/am-live.yml --storage.path=/alertmanager"
    environment:
      OVERLEAF_HOST: sharelatex
    volumes:
      - ./build-images/alertmanager:/etc/alertmanager:ro
      - ~/alertmanager_data:/alertmanager
    depends_on:
      - sharelatex

  node-exporter:
    profiles: ["d22"]
    restart: always
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    command: ["--path.procfs=/host/proc", "--path.rootfs=/host", "--path.sysfs=/host/sys"]
    volumes:
      - /:/host:ro
    depends_on:
      - prometheus

  # audit 035 (2026-09-30): Wakapi — the self-hosted WakaTime server for the
  # OlliTeX WakaTime integration (frontend/modules/wakatime + Go web
  # /user/wakatime routes). In the DEFAULT stack so a fresh OlliTeX instance
  # ships with a working WakaTime backend out of the box:
  #   • image: ghcr.io/muety/wakapi (official; pin a version tag in
  #     production via WAKAPI_IMAGE=ghcr.io/muety/wakapi:<tag>)
  #   • WAKAPI_PASSWORD_SALT — generated at deploy time (official
  #     quick-start pattern; the "generated salt"), WAKAPI_DATA_DIR →
  #     persistent /data volume (SQLite at /data/wakapi.db)
  #   • bootstrap admin is GENERATED on first boot (no default-weak
  #     password baked in) and persisted in that volume — read it from the
  #     container log once:  `docker logs wakapi 2>&1 | grep -i bootstrap`
  #     then override WAKAPI_ADMIN_EMAIL / WAKAPI_ADMIN_PASSWORD if you
  #     want fixed credentials;
  #   • host :5001 → container :3000 (no clashes with the stack);
  #   • pin the image in production: WAKAPI_IMAGE=ghcr.io/muety/wakapi:<tag>
  wakapi:
    restart: always
    image: "${WAKAPI_IMAGE:-ghcr.io/muety/wakapi:latest}"
    container_name: wakapi
    volumes:
      - ${WAKAPI_DATA_DIR:-$HOME/wakapi_data}:/data
    ports:
      - "5001:3000"
    environment:
      # the official quick-start contract: persistent /data volume (SQLite at
      # /data/wakapi.db) + a GENERATED password salt (32 alphanumerics):
      #   SALT=$$(cat /dev/urandom | LC_ALL=C tr -dc 'a-zA-Z0-9' | fold -w 32 | head -n 1)
      WAKAPI_PASSWORD_SALT: "${WAKAPI_PASSWORD_SALT:-}"
      WAKAPI_DB_TYPE: "${WAKAPI_DB_TYPE:-sqlite3}"
      WAKAPI_DB_NAME: "${WAKAPI_DB_NAME:-/data/wakapi.db}"
      # bootstrap admin identity (the PASSWORD is managed via the Wakapi UI;
      # never bake a weak default in — the salt is what makes its hashing sound)
      WAKAPI_BOOTSTRAP_ADMIN_EMAIL: "${WAKAPI_ADMIN_EMAIL:-admin@localhost.localdomain}"
      WAKAPI_BOOTSTRAP_ADMIN_PASSWORD: "${WAKAPI_ADMIN_PASSWORD:-}"
      WAKAPI_URL: "${WAKAPI_URL:-}"
      TZ: "${TZ:-UTC}"

  # D22 (8cbc1526) phase C — Grafana (shared datasource + repo-shipped
  # dashboards via provisioning; host :3180 -> container :3000 so it never
  # collides with the web-api internal :3000). Internal/observability UI only;
  # the HAProxy edge does NOT forward it.
  grafana:
    profiles: ["d22"]
    restart: always
    image: grafana/grafana-oss:11.6.0
    container_name: grafana
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_REPORTING_DISABLE_MESSAGE: "true"
      GF_ANALYTICS_DO_NOT_TRACK: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-ollitex-observability}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # D22 kiosk on /hub — explicit owner opt-in (build-images/grafana
      # README): anonymous Viewer + who may iframe. Defaults stay safe
      # (off / self-only).
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_SECURITY_CSP_FRAME_ANCESTORS: "${GRAFANA_CSP_FRAME_ANCESTORS:-self}"
    volumes:
      - ~/grafana_data:/var/lib/grafana
      - ./build-images/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./build-images/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3180:3000"
    depends_on:
      - prometheus

