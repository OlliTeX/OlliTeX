# toolkit/backup/common.conf — shared knobs for the toolkit data-backup suite.
# Sourced by every backup-*.sh / restore-*.sh in this directory.
#
# Where backups live (ONE canonical location, host- and TUI-visible):
#   ${PREFIX}/data/backups/<store>/<timestamp>.<ext>
# The TUI image mounts ${PREFIX}/data at /opt/ollitex/data, so the SAME
# directory is /opt/ollitex/data/backups inside the toolkit container.
#
# Container names (the canonical ollitex-toolkit stack; override per-box).
: "${PREFIX:=/opt/ollitex}"
: "${BACKUP_ROOT:=${PREFIX}/data/backups}"
: "${RETENTION:=7}"                       # keep the N newest per store
: "${OLLITEX_MONGO:=overleafmongo}"
: "${OLLITEX_REDIS:=overleafredis}"
: "${OLLITEX_PG:=ollitex-pg}"
: "${OLLITEX_PG_USER:=overleaf}"
: "${SW_MASTER:=seaweedfs-master}"
: "${SW_VOLUME:=seaweedfs-volume}"
: "${SW_FILER:=seaweedfs-filer}"
: "${TS:=$(date -u +%Y%m%dT%H%M%SZ)}"

log()  { printf '[backup] %s\n' "$*"; }
die()  { printf '[backup] ERROR: %s\n' "$*" >&2; exit 1; }

sha256f() {
  # sha256sum exists in the toolkit image; fall back to shasum (not alpine)
  if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1
  elif command -v shasum >/dev/null 2>&1; then shasum -a 256 "$1" | cut -d' ' -f1
  else cat "$1" | cksum; fi
}

retention() {
  # retention <dir> <glob> — keep the N newest matches, delete the rest
  dir=$1; glob=$2
  [ -d "$dir" ] || return 0
  ls -1t "$dir"/$glob 2>/dev/null | tail -n +$(( RETENTION + 1 )) | while read -r old; do
    rm -f -- "$old" && log "retention: removed $old"
  done
}
