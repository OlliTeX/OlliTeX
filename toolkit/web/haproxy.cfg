# haproxy — OlliTeX WEB PLANE facade (owner H + SSL directive 2026-10-06).
#
# Contract ported from /data_1/docker/compose_cep/nginx/nginx.conf (the
# proven production LB for the same app — "the other relevant stuff"):
#   * 80  → 301 https (ACME challenge path reserved, not wired — no ACME
#     on this box; the comment shows where it goes if it appears)
#   * 443 → TLS (self-signed pair; ${..._SSL_CRT} overridable for a real
#     cert later), HSTS, server_tokens off
#   * WebSocket upgrades for the app's long-lived routes (/editor,
#     /compile, /socket.io — nginx: Upgrade/Connection pass-through)
#   * cache policy triad: /static/svgedit/ non-hashed vendored assets →
#     no-cache must-revalidate; other NON-extension document routes →
#     no-store (the pre-deploy UI-staleness bug of 2026-09-07); extensioned
#     content-hashed assets → the app's own long-lived Cache-Control
#   * X-Forwarded-Proto/For (nginx parity); timeouts 3m both directions
#   * NOTE: haproxy has no request-body-size cap — the cep nginx
#     client_max_body_size 50M is enforced by the app's upload limits here
#     (documented deviation; the dev plane is loopback-only)
global
    log stdout format raw local0
    maxconn 8192
    # admin socket — the live inspection/control surface (proven useful
    # 2026-10-06 debugging): any unix-socket client can drive it:
    #   docker exec ollitex-haproxy perl -MIO::Socket::UNIX -e '
    #     my $s = IO::Socket::UNIX->new(Peer=>"/dev/shm/hx.sock") or die;
    #     $s->print("show stat\n"); while (my $l = <$s>) { print $l }'
    stats socket /dev/shm/hx.sock mode 600 level admin
    # TLS 1.2+ only (strictly better than the cep nginx legacy suite, which
    # still allowed TLS 1.0/1.1 — documented tightening)
    ssl-default-bind-ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option http-server-close
    timeout connect 5s
    timeout client  3m     # nginx proxy_read_timeout 3m (cep parity)
    timeout server  3m     # nginx proxy_send_timeout 3m (cep parity)
    timeout tunnel  1h     # WebSocket: /editor, /compile, /socket.io
    timeout http-keep-alive 10s
    retries 2

# ── HTTP: the ONLY thing it does is hand you over to TLS (cep parity) ──
frontend web-http
    bind :80
    # if ACME is ever added:
    #   acl acme path_beg /.well-known/acme-challenge/
    #   use_backend acme-chall if acme        (a static root location)
    # cep parity: `return 301 https://$host$request_uri` — the haproxy
    # equivalent is the scheme redirect: host + FULL uri (path AND query —
    # verified 2026-10-06 on this image). On the normal 80/443 deployment it
    # is exactly nginx's behavior; on this box's dev override ports the
    # documented entry is https://127.0.0.1:8481/ (same class of 301
    # port-semantics the cep nginx has when 443 is held by another service).
    http-request redirect scheme https code 301

# ── HTTPS: the web facade ──
frontend web-https
    bind :443 ssl crt /etc/haproxy/certs/web.pem alpn h2,http/1.1
    # header contract (nginx parity: X-Forwarded-Proto/-For; Host is kept
    # by haproxy by default, exactly like nginx's `proxy_set_header Host $host`)
    http-request set-header X-Forwarded-Proto https
    # HSTS — cep parity: max-age=31536000; includeSubdomains
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubdomains;"
    # server_tokens off (cep parity)
    http-response del-header Server

    # AG (owner 2026-10-09): the app's /metrics is internal-only (the
    # ollitex-web nginx exposes it to the docker subnets alone, for the
    # in-bridge Prometheus scrape). The public edge MUST NOT forward it:
    acl ismetrics path_beg /metrics
    http-request deny if ismetrics    # 403 (this haproxy build: no status on 'return')
    # AG (owner 2026-10-09, SUPERSEDES AJ-3): the public /grafana/ edge is
    # RETIRED — anonymous Grafana at a stable URL leaked every instance
    # metric to anyone. The stats pane now embeds through the OlliTeX
    # web service's admin-gated proxy:
    #   /admin/grafana/<rest> → site-admin session check → Grafana
    # (features/admingrafana; the public path still works for the app,
    # this edge line is deliberately REMOVED from the switch).
    # (backend grafana-back retained: nothing else on this edge uses it,
    # it stays only as an internal healthcheck target.)
    # G (owner 2026-10-09): self-hosted WakaTime (wakapi) under the same
    # origin — the wakatime admin section defaults the server URL here.
    # Served path-isolated like Grafana (wakapi has no subpath mode, so
    # its /api/... paths resolve under /wakapi/api/... on the edge).
    acl iswaka path_beg /wakapi/
    use_backend waka-back if iswaka
    default_backend web-back

backend waka-back
    option httpchk GET /
    http-check expect status 200
    # wakapi has no subpath mode — strip the /wakapi prefix (its routes
    # are absolute: /api/..., /dashboard ...). haproxy 2.8: path_reg
    # capture, not the -m rewrite syntax (absent in this build).
    http-request replace-path ^/wakapi/(.*) /\1
    server ollitex-wakapi ollitex-wakapi:3000 check inter 10s rise 2 fall 3

backend grafana-back
    option httpchk GET /api/health
    http-check expect status 200
    server ollitex-grafana ollitex-grafana:3000 check inter 10s rise 2 fall 3

backend web-back
    option httpchk GET /login      # the app's stable 200 route (/ and /healthz both 302→/login when anonymous; verified live)
    http-check expect status 200
    server ollitex-web ollitex-web:80 check inter 5s rise 2 fall 3

    # ── WebSocket (nginx Upgrade/Connection parity for the long-lived app routes)
    # haproxy 2.8: bracketed format fetches + the `-i` comparison flag
    # (the 1.x `,i` converter and `%var(...)` form do not exist in 2.8 — proven)
    http-request set-header Upgrade %[req.hdr(Upgrade)] if { req.hdr(Upgrade) -i upgrade }
    http-request set-header Connection upgrade if { req.hdr(Upgrade) -i upgrade }

    # ── cache policy triad (nginx parity, from the cep conf's three locations)
    # haproxy 2.8: http-response rules can't see request samples — capture the
    # path into a txn var on the request side, then ACL it (proven form):
    http-request set-var(txn.cpath) path
    acl svgedit var(txn.cpath) -m beg /static/svgedit/
    acl asset var(txn.cpath) -m end .js,.mjs,.css,.map,.woff,.woff2,.ttf,.eot,.otf,.svg,.png,.jpg,.jpeg,.webp,.gif,.ico,.json,.txt,.webmanifest,.mp4,.webm,.mp3,.wasm
    # non-hashed vendored subtree: store, but ALWAYS revalidate (cheap 304)
    http-response set-header Cache-Control "no-cache, must-revalidate" if svgedit
    # document routes: no-store (browsers must not heuristically cache them —
    # the 2026-09-07 pre-deploy UI staleness regression)
    http-response set-header Cache-Control no-store if !asset !svgedit
    # extensioned hashed assets: the app's own long-lived Cache-Control stands

# stats (the liveness surface; loopback-only)
listen stats
    bind 127.0.0.1:8636
    stats enable
    stats uri /
    stats refresh 10s
    stats admin if LOCALHOST
