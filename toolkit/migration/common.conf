# ── OlliTeX migration / common config ────────────────────────────────────────
# Sourced by every script in this directory. One file, no secrets, no JSON.
#
# Precedence (highest wins):
#   1. a value already exported in the shell environment
#   2. the canonical toolkit `.env`  (owner-configured, the prod source of truth)
#   3. the built-in defaults below
#
# SAFETY MODEL (owner directive 2026-10-06):
#   * We NEVER rename, drop, or mutate the legacy `sharelatex` database — it
#     stays intact as a read-only source (an Overleaf install may still own it).
#   * We COPY the legacy content into a NEW `ollitex` database and into the
#     canonical SeaweedFS object store (the new stack has NO fs filestore —
#     G2 STOR-1, the filestore service is S3-only). The legacy source tree
#     is opened read-only.
#   * Every import is idempotent and re-runnable; nothing here is destructive
#     to the source, and the targets (`ollitex` + the import bucket) are the
#     OlliTeX plane's own stores.

set -u

# Where the canonical stack + its .env live (override per box).
TOOLKIT_DIR="${TOOLKIT_DIR:-..}"
TOOLKIT_ENV="${TOOLKIT_ENV:-${TOOLKIT_DIR}/.env}"

# The keys this tooling cares about (used for the precedence dance).
_MIG_KEYS="PREFIX OLLITEX_DB LEGACY_DB LEGACY_ROOT \
MONGO_CONTAINER WEB_CONTAINER REDIS_CONTAINER MONGO_STAGE_DIR \
SEAWEEDFS_S3_PORT S3_ENDPOINT S3_IMPORT_BUCKET S3_IMPORT_ID S3_IMPORT_KEY"

# (1) capture any shell-environment overrides so nothing below clobbers them
declare -A _MIG_OVR=()
for _k in ${_MIG_KEYS}; do
  if [ -n "${!_k:-}" ]; then
    _MIG_OVR["${_k}"]="${!_k}"
  fi
done

# (3) built-in defaults (the weakest layer — overwritten by the .env below)
PREFIX="${PREFIX:-/opt/ollitex}"
OLLITEX_DB="${OLLITEX_DB:-ollitex}"
LEGACY_DB="${LEGACY_DB:-sharelatex}"
LEGACY_ROOT="${LEGACY_ROOT:-../../import-data}"  # legacy import source root (see import-data/)
MONGO_CONTAINER="${MONGO_CONTAINER:-overleafmongo}"
WEB_CONTAINER="${WEB_CONTAINER:-ollitex-web}"
REDIS_CONTAINER="${REDIS_CONTAINER:-overleafredis}"
MONGO_STAGE_DIR="${MONGO_STAGE_DIR:-/restore}"
# SeaweedFS (S3) import target — the new stack's durable file store (the fs
# filestore is retired, G2 STOR-1). Normal defaults; .env may override.
S3_IMPORT_BUCKET="${S3_IMPORT_BUCKET:-ollitex-legacy}"
S3_IMPORT_ID="${S3_IMPORT_ID:-}"   # empty = anonymous (the canonical S3 runs authless)
S3_IMPORT_KEY="${S3_IMPORT_KEY:-}"
# NOTE: S3_ENDPOINT itself is DERIVED below (it depends on SEAWEEDFS_S3_PORT,
# which may come from the .env loaded after this section).

# (2) load the canonical .env (owner-configured) over the built-in defaults
if [ -f "${TOOLKIT_ENV}" ]; then
  # shellcheck source=/dev/null
  set -a; . "${TOOLKIT_ENV}"; set +a
fi

# (1) re-apply the shell-environment overrides captured at the top
for _k in "${!_MIG_OVR[@]}"; do
  printf -v "${_k}" '%s' "${_MIG_OVR[${_k}]}"
done
unset _k

# Derived paths (always recomputed from the resolved values above)
LEGACY_MONGO_DUMP="${LEGACY_MONGO_DUMP:-${LEGACY_ROOT}/overleafmongo/backup}"
LEGACY_SERVER_DATA="${LEGACY_SERVER_DATA:-${LEGACY_ROOT}/overleafserver/data}"
LEGACY_REDIS="${LEGACY_REDIS:-${LEGACY_ROOT}/overleafredis}"
LEGACY_REDIS_DUMP="${LEGACY_REDIS_DUMP:-${LEGACY_REDIS}/data/dump.rdb}"

# S3 import endpoint — derived AFTER the .env load so SEAWEEDFS_S3_PORT (the
# stack's parameterized host port) resolves correctly. Explicit S3_ENDPOINT
# (shell env) always wins.
S3_ENDPOINT="${S3_ENDPOINT:-http://127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}}"

# ── small helpers ────────────────────────────────────────────────────────────
log()  { printf '\033[1;36m[migration]\033[0m %s\n' "$*"; }
warn() { printf '\033[1;33m[migration!]\033[0m %s\n' "$*" >&2; }
die()  { printf '\033[1;31m[migration-x]\033[0m %s\n' "$*" >&2; exit 1; }

require_cmd() { command -v "$1" >/dev/null 2>&1 || die "required command not found: $1"; }

require_container() {
  local c="$1"
  docker inspect "$c" >/dev/null 2>&1 \
    || die "container '$c' not found (is the canonical toolkit stack up?)"
}

preflight_safety() {
  [ -n "${LEGACY_DB}" ] && [ -n "${OLLITEX_DB}" ] || die "empty LEGACY_DB or OLLITEX_DB"
  [ "${LEGACY_DB}" != "${OLLITEX_DB}" ] \
    || die "safety: OLLITEX_DB must differ from LEGACY_DB (refusing to mutate the legacy ${LEGACY_DB} store)"
}

# Effective config dump (for logs / verify output)
print_config() {
  log "resolved config:"
  printf '    PREFIX             = %s\n' "${PREFIX}"
  printf '    OLLITEX_DB         = %s   (NEW target; legacy "%s" stays untouched)\n' "${OLLITEX_DB}" "${LEGACY_DB}"
  printf '    S3_ENDPOINT        = %s\n' "${S3_ENDPOINT}"
  printf '    S3_IMPORT_BUCKET   = %s\n' "${S3_IMPORT_BUCKET}"
  printf '    MONGO_CONTAINER    = %s\n' "${MONGO_CONTAINER}"
  printf '    WEB_CONTAINER      = %s\n' "${WEB_CONTAINER}"
  printf '    REDIS_CONTAINER    = %s\n' "${REDIS_CONTAINER}"
  printf '    LEGACY_MONGO_DUMP  = %s\n' "${LEGACY_MONGO_DUMP}"
  printf '    LEGACY_SERVER_DATA = %s\n' "${LEGACY_SERVER_DATA}"
  printf '    LEGACY_REDIS_DUMP  = %s\n' "${LEGACY_REDIS_DUMP}"
}
