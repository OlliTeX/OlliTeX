# OlliTeX Toolkit — standalone stack (owner spec, 2026-10-06)
#
#   ollitex-pg      Postgres = the config store (the stack's single source of
#                   truth). Self-signed SSL: on first start it auto-generates
#                   a 10-year CA + server cert under ${PREFIX}/data/ssl (Q5),
#                   then enables SSL. Password = ${PG_PASSWORD} (Q2).
#   overleafmongo   the stack Mongo (no host port on this box — the legacy cep
#                   stack owns 127.0.0.1:27017).
#   overleafredis   the stack Redis (same: legacy owns 127.0.0.1:6379).
#   ollitex-toolkit the SSH TUI plane (2222). Publickey auth, keys over
#                   passwords (Q4): an ed25519 pair is generated under
#                   ${PREFIX}/ssh when no public key is there yet. Connects to
#                   ollitex-pg over TLS pinned to the self-signed CA
#                   (sslmode=require&sslrootcert). Starts ONLY after
#                   ollitex-pg is healthy (Q6).
#
#   PROFILE "monitoring" (owner: "grafana + prometheus belong to the toolkit
#   stack" 2026-10-06) — optional, off by default; the toolkit starts them
#   from the config key MONITORING_ENABLED (one store: the PG config store;
#   visible in the TUI Settings → stack). Manual: docker compose --profile
#   monitoring up -d. Services: prometheus, grafana, mongodb-exporter,
#   redis-exporter, mongo-probe (real client liveness), node-exporter.
#
# Run:        cp env.example .env && vi .env && docker compose up -d
# SSH (TUI):  ssh -p 2222 -i ${PREFIX}/ssh/id_ed25519 ollitex@<host>
#
# .env provides: PREFIX, PG_PASSWORD, PG_PORT + the image pins (see
# env.example — the workspace blocks dotted env files, hence the non-dotted
# template name).

name: ollitex-toolkit

services:
  # ------------------------------------------------------------------- postgres
  ollitex-pg:
    # Owner-pinned 2026-10-06: postgres:18 (the earlier postgres:16 line was
    # the stale pin the owner flagged; the registry + lib/images.env agree on
    # postgres:18-alpine).
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: ollitex-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: overleaf
      POSTGRES_USER: overleaf
      POSTGRES_PASSWORD: ${PG_PASSWORD}   # the shared secret from .env (Q2)
    # The wrapper, in order:
    #   1. auto-generates the self-signed CA + server cert under the shared
    #      dir when absent (Q5: zero manual certificate ritual),
    #   2. fixes the server key ownership for the image's postgres user
    #      (by NAME — no hard-coded uid — postgres requires owner=postgres or
    #      root and <=0600),
    #   3. runs the STOCK entrypoint (which creates the POSTGRES_DB database
    #      on first boot) with SSL on.
    command:
      - sh
      - -c
      - |
        SSL=/etc/postgresql/ssl
        mkdir -p "$$SSL" 2>/dev/null || true
        if [ ! -f "$$SSL/ca.crt" ] || [ ! -f "$$SSL/server.crt" ] || [ ! -f "$$SSL/server.key" ]; then
          echo "generating self-signed CA + server cert (10y) under ${PREFIX}/data/ssl"
          openssl req -x509 -newkey rsa:3072 -keyout "$$SSL/ca.key" -out "$$SSL/ca.crt" \
            -days 3650 -nodes -subj "/CN=OlliTeX Toolkit Config CA" 2>/dev/null
          openssl req -new -newkey rsa:3072 -keyout "$$SSL/server.key" -out "$$SSL/server.csr" \
            -nodes -subj "/CN=ollitex-pg" 2>/dev/null
          printf "subjectAltName=DNS:ollitex-pg,DNS:localhost,IP:127.0.0.1" > "$$SSL/san.cnf"
          openssl x509 -req -in "$$SSL/server.csr" -CA "$$SSL/ca.crt" -CAkey "$$SSL/ca.key" \
            -CAcreateserial -out "$$SSL/server.crt" -days 3650 -extfile "$$SSL/san.cnf" 2>/dev/null
          openssl verify -CAfile "$$SSL/ca.crt" "$$SSL/server.crt"
          rm -f "$$SSL/san.cnf" "$$SSL/server.csr"
        fi
        chown postgres:postgres "$$SSL/server.key"
        chmod 600 "$$SSL/server.key"
        chmod 644 "$$SSL"/*.crt 2>/dev/null || true
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/etc/postgresql/ssl/server.crt \
          -c ssl_key_file=/etc/postgresql/ssl/server.key \
          -c ssl_ca_file=/etc/postgresql/ssl/ca.crt
    volumes:
      # Owner directive 2026-10-06: PG data + backup live under ${PREFIX} on
      # the host (the single-folder contract), not in a Docker-managed
      # volume — visible, backed up, and migratable without docker plumbing.
      # PG data under ${PREFIX} (owner directive). 2026-10-06: the legacy
      # 16 debug cluster was WIPTED (owner: debug data only) and the stack
      # runs the canonical pin, postgres:18-alpine. 18 contract: ONE mount
      # at the PG root (docker-library/postgres#37); the cluster lives at
      #   pgdata/18/docker  (== the image's PGDATA=/var/lib/postgresql/18/docker)
      # The 18 image ships NO child dirs under the root (verified), so the
      # host's 2026-10-06 masking quirk (16-image `data` child) cannot apply.
      - ${PREFIX}/data/pgdata:/var/lib/postgresql
      - ${PREFIX}/data/pgdata-backup:/backup
      # rw on purpose: the wrapper generates certs / fixes ownership in the
      # shared dir (cert/key CONTENTS are stable afterwards).
      - ${PREFIX}/data/ssl:/etc/postgresql/ssl
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overleaf -d overleaf"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    ports:
      - "${PG_PORT_HOST:-5432}:5432"   # NORMAL default; PG_PORT_HOST for dev

  # ------------------------------------------------------------------ mongodb
  # Service name = the hostname the web stack already uses (overleafmongo),
  # so dropping the web onto THIS network switches its Mongo over with a
  # network change alone. Container NAME stays distinct (ollitex-mongo) so
  # it never collides with the legacy cep container on this box.
  overleafmongo:
    # Owner-pinned 2026-10-06: mongo:9.0 (env-overridable).
    image: ${MONGO_IMAGE:-mongo:9.0}
    container_name: ollitex-mongo
    restart: unless-stopped
    environment:
      # kernel 6.19+/7.x SHSTK workaround (SAME env the running cep mongo
      # uses — SERVER-121912 / glibc hwcaps).
      GLIBC_TUNABLES: glibc.cpu.hwcaps=-SHSTK
    # 2026-10-07: --replSet (single member) — historyv1's Initialize uses a
    # Mongo multi-doc transaction ('Transaction numbers are only allowed on
    # a replica set member' on a standalone). Standalone data is
    # RS-compatible; this is the standard upgrade path and only adds the
    # oplog/local db. App clients keep resolving 'overleafmongo'.
    command: ["mongod", "--logpath", "/var/log/mongodb/mongod.log", "--bind_ip_all", "--replSet", "ollitexrs0"]
    volumes:
      - ${PREFIX}/data/mongo:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Host binding is env-configurable (owner 2026-10-06): NORMAL default
    # 27017; override MONGO_PORT_HOST in .env for dev / conflict boxes.
    ports:
      - "${MONGO_PORT_HOST:-27017}:27017"

  # --------------------------------------------------------------------- redis
  overleafredis:
    # Owner-pinned 2026-10-06: redis:8.10-alpine3.23 (env-overridable).
    image: ${REDIS_IMAGE:-redis:8.10-alpine3.23}
    container_name: ollitex-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - ${PREFIX}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Host binding env-configurable (owner 2026-10-06): NORMAL default 6379;
    # override REDIS_PORT_HOST in .env for dev / conflict boxes.
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"

  # ------------------------------------------------------------------- toolkit
  ollitex-toolkit:
    networks:
      - default
      - overleaf-network
    image: ollitex/toolkit-tui:main
    container_name: ollitex-toolkit
    restart: unless-stopped
    depends_on:
      # Q6 three-way gate (restored — the owner rule: depends_on is ALWAYS
      # condition: service_healthy):
      ollitex-pg:
        condition: service_healthy
      overleafmongo:
        condition: service_healthy
      overleafredis:
        condition: service_healthy
    environment:
      # Q2 + Q5: one shared password (${PG_PASSWORD} from .env) and the
      # self-signed CA pinned for the TLS connection.
      CONFIG_DB_DSN: postgres://overleaf:${PG_PASSWORD}@ollitex-pg:5432/overleaf?sslmode=require&sslrootcert=/etc/ollitex-ssl/ca.crt
      # env passthrough so the in-container runner (TUI stack ops) can
      # interpolate the canonical compose (owner 2026-10-06): the process
      # env is the plan context — no secrets added (PG_PASSWORD is already
      # the shared stack credential, resolved from .env at compose time).
      PREFIX: ${PREFIX:-/data_1/test_x/opt/ollitex}
      PG_PASSWORD: ${PG_PASSWORD}
      SSH_PORT: ${SSH_PORT:-2222}
      MONITORING_DATA_PATH: ${MONITORING_DATA_PATH:-${PREFIX:-/data_1/test_x/opt/ollitex}/data/monitoring}
      # Q4: key auth — authorized_keys from the mounted ${PREFIX}/ssh. The
      # image's entrypoint generates the pair there on first start when the
      # dir is empty (keys over passwords; the gate is fail-closed).
      OLLITEX_TOOLKIT_SSH_KEYFILE: /opt/ollitex/ssh/authorized_keys
      OLLITEX_TOOLKIT_DATA_DIR: /opt/ollitex/data
      OLLITEX_TOOLKIT_PROJECT: ollitex
      # the toolkit talks TO the mounted docker socket for stack ops
      DOCKER_HOST_UNIX: /var/run/docker.sock
    volumes:
      # Q3: everything the host sees lives under ${PREFIX}.
      - ${PREFIX}/data:/opt/ollitex/data
      - ${PREFIX}/ssh:/opt/ollitex/ssh
      - ${PREFIX}/data/ssl:/etc/ollitex-ssl:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${SSH_PORT:-2222}:2222"
    healthcheck:
      # the SSH/TUI listener (port 2222) is the service: TCP-connectable =
      # serving. The image is alpine with busybox nc (verified 2026-10-06).
      test: ["CMD", "nc", "-z", "127.0.0.1", "2222"]
      start_period: 20s
      interval: 30s
      timeout: 5s
      retries: 6

  # ====================================================================
  #  MONITORING — owner: "grafana + prometheus are part of the toolkit
  #  stack" (2026-10-06). One mechanism (owner D 2026-10-06): the
  #  ENABLE_MONITORING flag carries restart policy AND the admin's
  #  start/no-start decision ("no" for a temporary run; "unless-stopped"/
  #  "always" to run). ACTIVE BY DEFAULT (owner D). The legacy cep
  #  monitoring-* containers (owners of 9090/3180) are RETIRED — one
  #  monitoring plane, these service/container names (ollitex-*).
  #  Every container carries a healthcheck (policy C); depends_on is
  #  service_healthy gated; all state under ${PREFIX}/data/monitoring
  #  (policy B); owner-pinned images.

  ollitex-prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.53.5}
    container_name: ollitex-prometheus
    restart: ${ENABLE_MONITORING:-unless-stopped}   # Option no / unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "sed -e 's/__OVERLEAF_HOST__/${OVERLEAF_HOST:-overleafserver}/g' -e 's/__GITBRIDGE_HOST__/${GITBRIDGE_HOST:-git-bridge}/g' /etc/prometheus/prometheus.yml > /tmp/prometheus-live.yml && exec /bin/prometheus --config.file=/tmp/prometheus-live.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d --web.enable-lifecycle"
    environment:
      OVERLEAF_HOST: ${OVERLEAF_HOST:-overleafserver}
      GITBRIDGE_HOST: ${GITBRIDGE_HOST:-git-bridge}
    volumes:
      - ${MONITORING_DATA_PATH:-${PREFIX}/data/monitoring}:/etc/prometheus:ro
      - ${MONITORING_DATA_PATH:-${PREFIX}/data/monitoring}/prometheus-data:/prometheus
    ports:
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s

  ollitex-mongodb-exporter:
    image: ${MONGODB_EXPORTER_IMAGE:-percona/mongodb_exporter:0.43.0}
    container_name: ollitex-mongodb-exporter
    restart: ${ENABLE_MONITORING:-unless-stopped}   # Option no / unless-stopped
    # scratch image: single binary at /mongodb_exporter, no shell —
    # healthcheck = binary startability; DB liveness = ollitex-mongo-probe.
    command:
      # owner A 2026-10-06: the app's DB is the NEW `ollitex` DB — monitor
      # that one (the legacy `sharelatex` DB stays untouched and unmonitored)
      - "--mongodb.uri=mongodb://${MONITORING_MONGO_HOST:-overleafmongo}:${MONITORING_MONGO_PORT:-27017}/${OLLITEX_DB:-ollitex}?directConnection=true"
    environment:
      MONITORING_MONGO_HOST: ${MONITORING_MONGO_HOST:-overleafmongo}
      MONITORING_MONGO_PORT: ${MONITORING_MONGO_PORT:-27017}
    ports:
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${MONGODB_EXPORTER_PORT:-9216}:9216"
    healthcheck:
      # in-image self-check: the exporter binary still runs (proven: the
      # healthy legacy plane runs this exact test; no shell needed)
      test: ["CMD", "/mongodb_exporter", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      overleafmongo:
        condition: service_healthy

  ollitex-redis-exporter:
    image: ${REDIS_EXPORTER_IMAGE:-oliver006/redis_exporter:v1.58.0-alpine}
    container_name: ollitex-redis-exporter
    restart: ${ENABLE_MONITORING:-unless-stopped}   # Option no / unless-stopped
    environment:
      REDIS_ADDR: "redis://${MONITORING_REDIS_HOST:-overleafredis}:${MONITORING_REDIS_PORT:-6379}"
      MONITORING_REDIS_HOST: ${MONITORING_REDIS_HOST:-overleafredis}
      MONITORING_REDIS_PORT: ${MONITORING_REDIS_PORT:-6379}
    ports:
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${REDIS_EXPORTER_PORT:-9121}:9121"
    healthcheck:
      # alpine edition has no wget/nc applets — liveness = the exporter
      # binary itself still runs (verified: image entrypoint /redis_exporter)
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      overleafredis:
        condition: service_healthy

  ollitex-mongo-probe:
    # the owner-pinned mongo image — its mongosh is the canonical client for
    # a real protocol-level liveness check of the stack Mongo.
    image: ${MONGO_IMAGE:-mongo:9.0}
    container_name: ollitex-mongo-probe
    restart: ${ENABLE_MONITORING:-unless-stopped}   # Option no / unless-stopped
    command: ["sh", "-c", "sleep 3600"]
    environment:
      MONITORING_MONGO_HOST: ${MONITORING_MONGO_HOST:-overleafmongo}
      MONITORING_MONGO_PORT: ${MONITORING_MONGO_PORT:-27017}
    healthcheck:
      # the probe IS the mongo reachability check: healthy == the stack Mongo
      # answers a real protocol-level ping (busybox is absent from mongo:9.0 —
      # mongosh is the image's own canonical client).
      test: ["CMD-SHELL", "mongosh --quiet --host ${MONITORING_MONGO_HOST:-overleafmongo} --port ${MONITORING_MONGO_PORT:-27017} --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      overleafmongo:
        condition: service_healthy

  ollitex-mongodb-exporter-probe:
    # OWNER sidecar request (2026-10-06): the exporter image has no shell —
    # its HTTP SERVING proof lives here (busybox spider), same proven
    # pattern as ollitex-wakapi-probe. healthy == /metrics answers.
    image: ${PROBE_IMAGE:-busybox:1.36}
    container_name: ollitex-mongodb-exporter-probe
    restart: ${ENABLE_MONITORING:-unless-stopped}   # Option no / unless-stopped
    depends_on:
      ollitex-mongodb-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://ollitex-mongodb-exporter:9216/metrics >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    entrypoint: ["sh", "-c", "sleep infinity"]

  ollitex-redis-exporter-probe:
    # same sidecar contract for the redis exporter (busybox spider on its
    # in-container /metrics port 9121; the alpine exporter has no gotter)
    image: ${PROBE_IMAGE:-busybox:1.36}
    container_name: ollitex-redis-exporter-probe
    restart: ${ENABLE_MONITORING:-unless-stopped}   # Option no / unless-stopped
    depends_on:
      ollitex-redis-exporter:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://ollitex-redis-exporter:9121/metrics >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    entrypoint: ["sh", "-c", "sleep infinity"]

  ollitex-node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.9.1}
    container_name: ollitex-node-exporter
    restart: ${ENABLE_MONITORING:-unless-stopped}   # Option no / unless-stopped
    command: ["--path.procfs=/host/proc", "--path.rootfs=/host", "--path.sysfs=/host/sys"]
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"   # NORMAL default; env override for dev
    volumes:
      - /:/host:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/metrics"]
      start_period: 15s
      interval: 30s
      retries: 5
      timeout: 5s

  ollitex-grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:11.6.0}
    container_name: ollitex-grafana
    restart: ${ENABLE_MONITORING:-unless-stopped}   # Option no / unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ollitex}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_USERS_SIGNUP_ENABLED: "false"
      # AJ-3 (owner 2026-10-08): served under the app's origin (https://<host>/grafana/)
      # by the haproxy isgraf branch — Grafana must generate its URLs and routes
      # relative to that root (serve-from-subpath).
      GF_SERVER_ROOT_URL: "${GF_SERVER_ROOT_URL:-https://psintern.neuro.uni-bremen.de/grafana/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GF_SERVER_SERVE_FROM_SUB_PATH:-true}
      # Hub kiosk opt-in (server-ce/grafana README: explicit owner opt-in,
      # NOT a default): anonymous Viewer role for kiosk embeds + which origin
      # may iframe Grafana. Both default to the safe state (off / self-only).
      # AJ-3 (owner 2026-10-08): the Instance statistics section IS the
      # Grafana system — the kiosk iframes need anonymous Viewer auth (no
      # credentials in the embedded dashboard) and the app origin may iframe it.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_SECURITY_CSP_FRAME_ANCESTORS: ${GRAFANA_CSP_FRAME_ANCESTORS:-'self' https://psintern.neuro.uni-bremen.de}
    volumes:
      - ${MONITORING_DATA_PATH:-${PREFIX}/data/monitoring}/grafana-provisioning:/etc/grafana/provisioning
      - ${MONITORING_DATA_PATH:-${PREFIX}/data/monitoring}/grafana-dashboards:/var/lib/grafana/dashboards
      - ${MONITORING_DATA_PATH:-${PREFIX}/data/monitoring}/grafana-data:/var/lib/grafana
    # AJ-3 (owner 2026-10-08): NO host port mapping — the haproxy graf-https
    # facade (haproxy.cfg, :3000 with the same TLS pair) is the ONLY edge so
    # owner traffic to https://<host>:3000/... goes through one edge.
    healthcheck:
      # proven: the healthy legacy grafana runs this exact test and the
      # grafana-oss image ships the gotter (verified 2026-10-06)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    depends_on:
      ollitex-prometheus:
        condition: service_healthy

  # ====================================================================
  #  SEAWEEDFS (profile "seaweedfs", owner 2026-10-06: the four S3
  #  services are part of the toolkit stack). The canonical file carries
  #  them (supersedes lib/docker-compose.seaweedfs.yml for this stack).
  #  Container NAMES are kept from the legacy layout on purpose: the web
  #  plane's S3 endpoint (http://seaweedfs-s3:8333) + the Go filestore/
  #  docstore env reference those names — one storage plane.
  #  Activation: SEAWEEDFS_ENABLED in the config store (TUI Settings →
  #  stack). Restart policy: ENABLE_SEAWEEDFS (owner env flag 2026-10-06).
  #  NOTE (this box): the legacy cep seaweedfs-* containers still hold
  #  host ports 9333/18080/8333 — retire them before flipping the flag on.
  # ====================================================================

  seaweedfs-master:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:latest}   # same tag as the running legacy plane (pin a digest on the next upgrade)
    container_name: seaweedfs-master
    hostname: seaweedfs-master
    restart: ${ENABLE_SEAWEEDFS:-unless-stopped}   # Option no / unless-stopped
    command: "master -ip=seaweedfs-master -ip.bind=0.0.0.0 -metricsPort=9327"
    ports:
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${SEAWEEDFS_MASTER_PORT:-9333}:9333"     # master HTTP
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${SEAWEEDFS_MASTER_GRPC_PORT:-19333}:19333"   # master gRPC
    volumes:
      - ${PREFIX}/data/seaweedfs/master:/data
    healthcheck:
      # seaweedfs 4.x: the master's REST /status route is volume-id scoped;
      # the metrics HTTP port (command -metricsPort=9327) is the stable
      # liveness surface (verified: 200 with SeaweedFS_* gauges).
      test: ["CMD-SHELL", "curl -fsS --connect-timeout 3 http://localhost:9327/metrics >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  seaweedfs-volume:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:latest}
    container_name: seaweedfs-volume
    hostname: seaweedfs-volume
    restart: ${ENABLE_SEAWEEDFS:-unless-stopped}
    # Proven flag set for this image (3-week legacy plane, same 4.46 build):
    # -mserver (not -url/-master), HTTP 8080, gRPC 18080 (http+10000 pattern).
    command: 'volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -ip.bind=0.0.0.0 -port=8080 -dir=/data -max=0'
    ports:
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${SEAWEEDFS_VOLUME_PORT:-8080}:8080"        # volume HTTP
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${SEAWEEDFS_VOLUME_GRPC_PORT:-18080}:18080" # volume gRPC
    healthcheck:
      # the volume's /status serves DiskStatuses JSON (200, verified on 4.46);
      # /metrics there returns 400, so /status is the liveness surface.
      test: ["CMD-SHELL", "curl -fsS --connect-timeout 3 http://localhost:8080/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      seaweedfs-master:
        condition: service_healthy

  seaweedfs-filer:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:latest}
    container_name: seaweedfs-filer
    hostname: seaweedfs-filer
    restart: ${ENABLE_SEAWEEDFS:-unless-stopped}
    command: 'filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer -ip.bind=0.0.0.0'
    ports:
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${SEAWEEDFS_FILER_PORT:-8888}:8888"        # filer HTTP (4.x default, legacy-proven)
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${SEAWEEDFS_FILER_GRPC_PORT:-18888}:18888" # filer gRPC
    healthcheck:
      # seaweedfs 4.x dropped the filer /status route; the filer HTTP root
      # serves its UI page and answers 200 when up (verified on 4.46)
      test: ["CMD-SHELL", "curl -fsS --connect-timeout 3 http://localhost:8888/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      seaweedfs-master:
        condition: service_healthy

  seaweedfs-s3:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:latest}
    container_name: seaweedfs-s3
    hostname: seaweedfs-s3
    restart: ${ENABLE_SEAWEEDFS:-unless-stopped}
    # S3 gateway default port is 8333 — the app contract (OVERLEAF_FILESTORE_S3_ENDPOINT
    # = http://seaweedfs-s3:8333). Points at the filer's proven 8888.
    command: 's3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0'
    ports:
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${SEAWEEDFS_S3_PORT:-8333}:8333"   # S3 API
    healthcheck:
      # the S3 gateway has no /status; curl (without -f) exits 0 for ANY
      # HTTP answer (200/403 XML) and non-zero on connection failure.
      # NOTE: no $variables here — compose interpolates them host-side.
      test: ["CMD-SHELL", "curl -s -o /dev/null --max-time 5 http://localhost:8333/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      seaweedfs-filer:
        condition: service_healthy

  # ====================================================================
  #  WAKA API (profile "wakapi", owner 2026-10-06). Supersedes the legacy
  #  standalone "wakapi" container (same image/config family; sqlite state
  #  moves to ${PREFIX}/data/wakapi per policy B).
  #  Activation: WAKA_API_ENABLED in the config store. Restart policy:
  #  ENABLE_WAKA_API (owner env flag 2026-10-06).
  #  NOTE (this box): 127.0.0.1:3000 is held by the forgejo-test box —
  #  set WAKA_API_PORT (e.g. 3001) in .env when enabling here.
  # ====================================================================

  ollitex-wakapi:
    image: ${WAKA_API_IMAGE:-ghcr.io/muety/wakapi:latest}   # same family as the running legacy wakapi (pin on the next upgrade)
    container_name: ollitex-wakapi
    restart: ${ENABLE_WAKA_API:-unless-stopped}   # Option no / unless-stopped
    # OWNER 2026-10-06 (C): wakapi uses the ONE Postgres store — never
    # sqlite (the mandatory ollitex-pg is the database; "wakapi" database
    # created idempotently there). No local data dir anymore: all state is
    # in Postgres (backups = the pg backup plane).
    ports:
      - "${WAKA_API_PORT:-3000}:3000"   # HOST side env-configurable (dev boxes: 3001); container stays 3000
    environment:
      WAKAPI_DB_TYPE: postgres
      WAKAPI_DB_HOST: ollitex-pg
      WAKAPI_DB_PORT: "5432"
      WAKAPI_DB_USER: overleaf
      WAKAPI_DB_PASSWORD: "${PG_PASSWORD:?PG_PASSWORD required (toolkit/.env)}"
      WAKAPI_DB_NAME: wakapi
    healthcheck:
      # image has no shell/wget/ls (scratch family): liveness = the binary
      # runs; HTTP serving is proven by ollitex-wakapi-probe.
      test: ["CMD", "/app/wakapi", "--version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      ollitex-pg:
        condition: service_healthy

  ollitex-wakapi-probe:
    # HTTP liveness for the shell-less wakapi (same pattern as
    # ollitex-mongo-probe): a busybox spider against the API port.
    # healthy == wakapi is actually serving on 3000.
    image: ${PROBE_IMAGE:-busybox:1.36}
    container_name: ollitex-wakapi-probe
    restart: ${ENABLE_WAKA_API:-unless-stopped}
    depends_on:
      ollitex-wakapi:
        condition: service_healthy
    # CMD form (busybox has a shell; keep it one process)
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://ollitex-wakapi:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    entrypoint: ["sh", "-c", "sleep infinity"]

  # ====================================================================
  #  LANGUAGE TOOL (profile "languagetool", owner 2026-10-06). Canonical
  #  carrier for the grammar-checker (supersedes the lib overlay for this
  #  stack). Container name "languagetool" is kept — the web plane's
  #  LANGUAGETOOL_URL references that host name.
  #  Activation: LANGUAGE_TOOL_ENABLED in the config store. Restart policy:
  #  ENABLE_LANGUAGE_TOOL (owner env flag 2026-10-06).
  # ====================================================================

  languagetool:
    image: ${LANGUAGE_TOOL_IMAGE:-erikvl87/languagetool:latest}   # legacy pin (pin a tag on the next upgrade)
    container_name: languagetool
    hostname: languagetool
    restart: ${ENABLE_LANGUAGE_TOOL:-unless-stopped}   # Option no / unless-stopped
    environment:
      Java_Xms: 512m
      Java_Xmx: 2g
      langtool_languageModel: /ngrams
    ports:
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${LANGUAGE_TOOL_PORT:-8010}:8010"
    volumes:
      - ${PREFIX}/data/languagetool/ngrams:/ngrams:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --timeout=5 http://localhost:8010/v2/languages 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ====================================================================
  #  WEB PLANE (owner D 2026-10-06: absorbed from compose-web.yaml into the
  #  ONE canonical stack — compose-web.yaml is RETIRED).
  #
  #  ollitex-web : the app. One image for the whole app. Its ONE database is
  #                the NEW `ollitex` DB (mongo-import target — the legacy
  #                `sharelatex` DB stays untouched; owner A 2026-10-06).
  #                Durable file content lives in the SeaweedFS S3 plane (the
  #                fs filestore is retired, G2 STOR-1).
  #  haproxy     : the TLS facade (80 → 301 → 443, cep nginx parity).
  #                Both optional groups, ACTIVE BY DEFAULT (owner B pattern:
  #                restart: ${ENABLE_*:-unless-stopped}; "no" = off).
  # ====================================================================

  ollitex-web:
    networks:
      - default
      - overleaf-network
    image: ${WEB_IMAGE:-ollitex/ollitex:main}
    container_name: ollitex-web
    restart: ${ENABLE_OLLITEX_WEB:-unless-stopped}   # Option no / unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # data plane = the ONE canonical store (service names = hostnames on
      # this stack's network). The app's DB is the NEW ollitex DB.
      OVERLEAF_MONGO_URL: mongodb://overleafmongo:27017/${OLLITEX_DB:-ollitex}
      MONGO_HOST: overleafmongo
      MONGO_PORT: "27017"
      OVERLEAF_REDIS_HOST: overleafredis
      REDIS_HOST: overleafredis
      REDIS_PORT: "6379"
      # secrets come from .env (owner policy: never baked into compose).
      # OVERLEAF_SESSION_SECRET is REQUIRED (openssl rand -hex 32) — an empty
      # value here would silently disable session signing.
      OVERLEAF_SESSION_SECRET: "${OVERLEAF_SESSION_SECRET:-}"
      OVERLEAF_INVITE_TOKEN_SECRET: "${OVERLEAF_INVITE_TOKEN_SECRET:-}"
      LLM_KEY_SECRET: "${LLM_KEY_SECRET:-}"
      OT_JWT_AUTH_KEY: "${OT_JWT_AUTH_KEY:-}"
      # ── PROD SETTINGS (owner 2026-10-06: from /data_1/docker/compose_cep/.env ──
      # hostnames, SSO/OIDC, mail, LLM, app branding — values live in .env)
      OVERLEAF_SITE_URL: "${OVERLEAF_SITE_URL:-}"
      OVERLEAF_APP_NAME: "${OVERLEAF_APP_NAME:-}"
      OVERLEAF_NAV_TITLE: "${OVERLEAF_NAV_TITLE:-}"
      OVERLEAF_CUSTOM_EMAIL_FOOTER: "${OVERLEAF_CUSTOM_EMAIL_FOOTER:-}"
      OVERLEAF_ADMIN_EMAIL: "${OVERLEAF_ADMIN_EMAIL:-}"
      OVERLEAF_EMAIL_FROM_ADDRESS: "${OVERLEAF_EMAIL_FROM_ADDRESS:-}"
      OVERLEAF_EMAIL_PASSWORD: "${OVERLEAF_EMAIL_PASSWORD:-}"
      OVERLEAF_EMAIL_SMTP_HOST: "${OVERLEAF_EMAIL_SMTP_HOST:-}"
      OVERLEAF_EMAIL_SMTP_PORT: "${OVERLEAF_EMAIL_SMTP_PORT:-}"
      OVERLEAF_EMAIL_SMTP_SECURE: "${OVERLEAF_EMAIL_SMTP_SECURE:-}"
      OVERLEAF_EMAIL_SMTP_USER: "${OVERLEAF_EMAIL_SMTP_USER:-}"
      OVERLEAF_EMAIL_SMTP_IGNORE_TLS: "${OVERLEAF_EMAIL_SMTP_IGNORE_TLS:-}"
      EXTERNAL_AUTH: "${EXTERNAL_AUTH:-}"
      OVERLEAF_OIDC_ISSUER: "${OVERLEAF_OIDC_ISSUER:-}"
      OVERLEAF_OIDC_CLIENT_ID: "${OVERLEAF_OIDC_CLIENT_ID:-}"
      OVERLEAF_OIDC_CLIENT_SECRET: "${OVERLEAF_OIDC_CLIENT_SECRET:-}"
      OVERLEAF_OIDC_IDENTITY_SERVICE_NAME: "${OVERLEAF_OIDC_IDENTITY_SERVICE_NAME:-}"
      LLM_API_URL: "${LLM_API_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL_NAME: "${LLM_MODEL_NAME:-}"
      CRYPTO_RANDOM: "${CRYPTO_RANDOM:-}"
      WEB_API_PASSWORD: "${WEB_API_PASSWORD:-}"
      NODE_ENV: production
      # git contract (the legacy git-bridge container is attached to this
      # stack's network — verified 2026-10-06)
      GIT_BRIDGE_HOST: ${GIT_BRIDGE_HOST:-git-bridge}
      GIT_BRIDGE_PORT: "${GIT_BRIDGE_PORT:-8000}"
      # admin privilege (node parity: settings.defaults; prod ran with it on —
      # owner 2026-10-06: davrot not recognized as admin):
      ADMIN_PRIVILEGE_AVAILABLE: "${ADMIN_PRIVILEGE_AVAILABLE:-true}"
      # ── SUB-SERVICE PLANE (owner 2026-10-06: collab 401 / history-v1 500
      #    after the ollitex-DB migration — the Node-era sub-services default
      #    to `sharelatex` and a dead S3 endpoint) ─────────────────────────
      # canonical Mongo for every sub-service (DB name from the URI):
      MONGO_CONNECTION_STRING: mongodb://overleafmongo:27017/${OLLITEX_DB:-ollitex}
      # collab's explicit DB knob (its client overrides the URI's DB):
      OLLITEX_DB_NAME: ${OLLITEX_DB_NAME:-ollitex}
      # history-v1 PG plane (chunks/zip tables) — prod parity:
      DATABASE_URL: "${DATABASE_URL:-}"
      # the stack PG password passed through explicitly (sub-services that
      # build DSNs from user/host/password envs; owner 2026-10-06):
      PG_PASSWORD: "${PG_PASSWORD:-}"
      # history-v1 S3 persistor → the live canonical SeaweedFS (anonymous
      # verified 2026-10-06): image default (172.17.0.1:8333) is dead.
      AWS_S3_ENDPOINT: "${AWS_S3_ENDPOINT:-http://seaweedfs-s3:8333}"
      AWS_S3_PATH_STYLE: "${AWS_S3_PATH_STYLE:-true}"
      # filestore S3 mode → SAME live endpoint (owner 2026-10-07: filestore
      # logged `dial tcp 172.17.0.1:8333 i/o timeout` = dead image default →
      # every filestore S3 op timed out → clsi compile copied NO files into
      # the sandbox → `Could not find file 'main.tex'` → no output.pdf.
      # This env is the filestore's own endpoint knob.
      OVERLEAF_FILESTORE_S3_ENDPOINT: "${OVERLEAF_FILESTORE_S3_ENDPOINT:-http://seaweedfs-s3:8333}"
      # hub grafana embed (empty = pane hidden — the safe default)
      # AJ-3 (owner 2026-10-08): the Instance statistics section embeds
      # Grafana kiosks from THIS base (haproxy :3000 facade, same TLS pair;
      # anonymous Viewer in the grafana container — see its env above).
      HUB_GRAFANA_EMBED_URL: "${HUB_GRAFANA_EMBED_URL:-https://psintern.neuro.uni-bremen.de/grafana}"
      # ── SANDBOXED COMPILES (docker-in-docker on the HOST daemon) ──────
      # clsi (tex) + clsi_typst compile via `docker run` children: the tex
      # side reads SANDBOXED_COMPILES_HOST_DIR_* (env.sh dump of the
      # container env), the typst run script re-exports the SAME dirs from
      # ${TYPSF_*}. 2026-10-07 (owner: compile 500 + clsi_typst
      # crash-loop): the image had SANDBOXED_COMPILES on but THIS container
      # lacked the host dirs + the docker socket → config gate crashed on
      # start. Host dirs live under /data_1 (owner data root convention).
      # ── AK-8 (owner 2026-10-08): PANDOC is FIXED ON — the Word/Markdown/HTML
      # exports (File → Download block) are enabled. Web gate =
      # sitesettings.PandocConversionsEnabled + the export-* split-test flags;
      # CLSI gate = the same env for the conversion endpoints. Worker image
      # ollitex/pandoc (495MB) is already local.
      # AK-7 (owner 2026-10-08): Extended-CE Python Runner — FIXED ON. Browser-side
      # (Pyodide, served from /js/libs/pyodide/), the editor splits .py files into a
      # Run/Stop code editor. Frontend gate = the overleaf-code split-test variant
      # (settings.defaults.js) seeded from this env; the admin switch lives under
      # Site settings > General (site.general.pythonRunner).
      ENABLE_PYTHON_RUNNER: "${ENABLE_PYTHON_RUNNER:-true}"
      ENABLE_PANDOC_CONVERSIONS: "${ENABLE_PANDOC_CONVERSIONS:-true}"
      PANDOC_IMAGE: "${PANDOC_IMAGE:-ollitex/pandoc:main}"
      # ── AK-5 (owner 2026-10-08): the selectable sandbox compile images —
      # the settings-modal Compiler pane + the admin Compilation page list
      # comes from these (seeds.go), matching the images present on the host.
      ALL_TEX_LIVE_DOCKER_IMAGES: "${ALL_TEX_LIVE_DOCKER_IMAGES:-texlive/texlive:latest-full,texlive/texlive:TL2025-historic}"
      ALL_TEX_LIVE_DOCKER_IMAGE_NAMES: "${ALL_TEX_LIVE_DOCKER_IMAGE_NAMES:-TeXLive rolling,TeXLive 2025}"
      TEX_LIVE_DOCKER_IMAGE: "${TEX_LIVE_DOCKER_IMAGE:-texlive/texlive:latest-full}"
      SANDBOXED_COMPILES: "true"
      SANDBOXED_COMPILES_HOST_DIR_COMPILES: "${SANDBOXED_COMPILES_HOST_DIR_COMPILES:-/data_1/ols/compiles}"
      SANDBOXED_COMPILES_HOST_DIR_CACHE: "${SANDBOXED_COMPILES_HOST_DIR_CACHE:-/data_1/ols/cache}"
      SANDBOXED_COMPILES_HOST_DIR_OUTPUT: "${SANDBOXED_COMPILES_HOST_DIR_OUTPUT:-/data_1/ols/output}"
      TYPSF_COMPILES: "${SANDBOXED_COMPILES_HOST_DIR_COMPILES:-/data_1/ols/compiles}"
      TYPSF_OUTPUT: "${SANDBOXED_COMPILES_HOST_DIR_OUTPUT:-/data_1/ols/output}"
      TYPSF_CACHE: "${SANDBOXED_COMPILES_HOST_DIR_CACHE:-/data_1/ols/cache}"
      # v1 history basic-auth pair (web caller -> historyv1 service): BOTH
      # sides read V1_HISTORY_PASSWORD; the user defaults to "staging" on
      # both (keep it that way — the two sides have DIFFERENT user keys).
      # 2026-10-07 (owner: history 500/401): unset => web sent empty
      # password => every v1 call 401.
      V1_HISTORY_PASSWORD: "${V1_HISTORY_PASSWORD:-}"
      # SeaweedFS S3 emulation 500s on a conditional (If-None-Match) PUT;
      # real AWS/minio accept it (Node parity). 2026-10-07 live evidence:
      # v1 initializeProject -> s3x 500 InternalError on If-None-Match.
      OVERLEAF_HISTORY_S3_IF_NONE_MATCH: "${OVERLEAF_HISTORY_S3_IF_NONE_MATCH:-false}"
    # ── DATA PLANE: durable file content ──────────────────────────────
    # The app's default filestore/docstore is fs on /var/lib/overleaf, and the
    # imported prod settings DB has no S3 row yet (legacy overleafserver ran
    # fs on the shared prod data dir). Bind that dir so the canonical web has
    # the same files (owner H: web + filestore = same plane). A formal S3
    # import (files-import.sh) can supersede this later (G2 STOR-1).
    volumes:
      - ${FILESTORE_DATA_DIR:-${PREFIX}/data/overleaf}:/var/lib/overleaf
      # sandboxed compiles run as docker children on the HOST daemon (the
      # clsi run scripts add www-data to the socket group when it is
      # present): 2026-10-07 (compile 500: no /var/run/docker.sock here)
      - /var/run/docker.sock:/var/run/docker.sock
      # sandboxed-compile scratch plane (2026-10-06, live-proven regression):
      # clsitex writes compile resources to /var/lib/overleaf/data/compiles
      # (inner) and the docker DAEMON bind-mounts the HOST plane (SANDBOXED
      # _COMPILES_HOST_DIR_* = /data_1/ols/*) into the compile container's
      # /compile. Before these mounts the inner paths resolved into the
      # legacy CEP tree (FILESTORE_DATA_DIR) so the compile container saw an
      # EMPTY /compile -> "Could not find file 'main.tex'" (owner project
      # 671bd3cf..., 17:44 + 19:15 repros; the written main.tex was found in
      # the CEP tree). Mounting /data_1/ols/* over the inner paths makes write
      # target == bind source == daemon auto-create target.
      - ${OLLITEX_COMPILE_DIR:-/data_1/ols/compiles}:/var/lib/overleaf/data/compiles
      - ${OLLITEX_OUTPUT_DIR:-/data_1/ols/output}:/var/lib/overleaf/data/output
      - ${OLLITEX_CACHE_DIR:-/data_1/ols/cache}:/var/lib/overleaf/data/cache
    # no host port: haproxy is the facade
    healthcheck:
      # the app ships curl; anonymous `/` answers 302→/login (curl -f accepts
      # it) — the proven live test of this exact container (2026-10-06)
      test: ["CMD-SHELL", "curl -fs --connect-timeout 5 http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    depends_on:
      overleafmongo:
        condition: service_healthy
      overleafredis:
        condition: service_healthy

  haproxy:
    image: ${HAPROXY_IMAGE:-haproxy:2.8}   # same major as the running legacy LBs (proven)
    container_name: ollitex-haproxy
    restart: ${ENABLE_HAPROXY:-unless-stopped}   # Option no / unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    # official image runs as non-root user `haproxy` (uid 99): low-port binds
    # need the capability
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${HAPROXY_PORT:-80}:80"          # plain HTTP → 301 TLS only (cep nginx parity)
      - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${HAPROXY_TLS_PORT:-443}:443"    # the TLS facade (dev override in .env)
    volumes:
      - ./web/haproxy.cfg:/haproxy.cfg:ro
      # REAL prod TLS (owner 2026-10-06): the Let's Encrypt pair for
      # psintern.neuro.uni-bremen.de (fullchain2 + privkey2), combined into
      # this ONE haproxy-format PEM on the host. The host privkey stays
      # 0600 root (haproxy runs as uid 99 and cannot hold a direct
      # /etc/letsencrypt mount); renewal = re-run:
      #   cat /etc/letsencrypt/live/psintern.neuro.uni-bremen.de/fullchain.pem \
      #       /etc/letsencrypt/live/psintern.neuro.uni-bremen.de/privkey.pem \
      #       > ${PREFIX}/data/ssl/web/web.pem
      - ${PREFIX}/data/ssl/web/web.pem:/etc/haproxy/certs/web.pem:ro
    healthcheck:
      # image ships NO wget/curl/busybox — core perl is the probe (verified
      # 2026-10-06). Checks the front answers 301/302 (80→TLS live).
      test: ["CMD-SHELL", "perl -e 'use IO::Socket::INET; my $$s = IO::Socket::INET->new(PeerAddr=>\"127.0.0.1:80\", Timeout=>4) or exit 1; $$s->print(\"GET / HTTP/1.0\\r\\nHost: ollitex\\r\\n\\r\\n\"); my $$st = <$$s>; exit($$st=~/30[012]/ ? 0 : 1)' || exit 1"]
      # NOTE: $$-escaping is REQUIRED — compose interpolates $vars host-side.
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      ollitex-web:
        condition: service_healthy
    command: ["/usr/local/sbin/haproxy", "-f", "/haproxy.cfg", "-db", "-W"]

  # ------------------------------------------------------------------------
  # B5 (owner 2026-10-06): the private image registry — ollitex.registry:11435
  # The ollitex/* builds (ollitex/ollitex:main, ollitex/toolkit-tui:main, the
  # golang builder, the base stage) are pushed here so bakes on any box of
  # the owner's fleet pull a VERIFIED local image instead of an anonymous
  # registry. /etc/hosts maps ollitex.registry -> 127.0.0.1 on this host;
  # docker-daemon-side pulls/pushes resolve through host DNS, which is the
  # only path the build needs.
  #  ENABLE_REGISTRY restart flag · REGISTRY_PORT parameterized port.
  registry:
    image: registry:2
    restart: ${ENABLE_REGISTRY:-unless-stopped}   # Option no / unless-stopped
    ports:
      - "${REGISTRY_PORT:-11435}:5000"
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"   # allow DELETE /v2/<name>/manifests/<ref> for registry pruning
    volumes:
      # owner data tree (same convention as every other store in this stack)
      - ${PREFIX}/data/registry:/var/lib/registry
    healthcheck:
      # registry:2 is alpine-based (busybox wget present).
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/_catalog"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# --------------------------------------------------------------------------
# External network: the shared content store (overleafmongo = the legacy
# cep store holding the imported `ollitex` DB) lives on overleaf-network.
# The TUI (hub views) and the web app must be able to name it.
networks:
  overleaf-network:
    external: true
