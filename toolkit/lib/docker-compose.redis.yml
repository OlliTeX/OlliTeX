---
services:

    # Redis — healthcheck + AOF persistence flags integrated from the
    # compose_cep production stack (2026-09-13).
    redis:
        restart: always
        image: "${REDIS_IMAGE}"
        volumes:
            - "${REDIS_DATA_PATH}:/data"
        container_name: overleafredis
        hostname: overleafredis
        command: ${REDIS_COMMAND}
        expose:
            - 6379
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 3s

    ollitex:
      depends_on:
        redis:
          condition: service_healthy
      links:
        - redis
