# checkuser — the account/usage audit checker (cep plane: check_users).
# Runs as a long-lived job container; liveness = the process is up (it works
# on a schedule, so an HTTP-ish probe is not applicable).
services:
  checkuser:
    image: "${CHECKUSER_IMAGE:-check_user_image}"
    container_name: checkuser
    restart: always
    volumes:
      - "${CHECKUSER_DATA_PATH:-data/checkuser}:/data"
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c", "pip install argh && cd / && sleep infinity"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'sleep infinity' >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
