---
# OlliTeX toolkit — MONITORING overlay (D22 ecosystem, opt-in).
#
# Enabled by MONITORING_ENABLED=true (default false — the base stack is
# unchanged without it; same opt-in shape as the languagetool overlay).
#
# Container policies honored throughout (owner addendum B/C + credits D):
#   * every stateful dir is a bind mount inside the toolkit data dir (B);
#   * EVERY container below carries a docker healthcheck (C) — exporter
#     images that ship without a shell get a healthcheck their own binary
#     can execute, and the real DB liveness is carried by the probe
#     containers that run the same pinned images we already use for the
#     databases (the canonical client probe);
#   * borrowed code is credited (CREDITS.md).
#
# Services:
#   prometheus          prom/prometheus v2.53.5 (same pin as server-ce d22;
#                       binary is /bin/prometheus on that image, runs as
#                       uid 65534 — the toolkit pre-creates + chowns the
#                       tsdb dir to that uid in materialization).
#   mongodb-exporter    percona/mongodb_exporter 0.43.0 (the prom
#                       mirror was retired upstream). Healthcheck = binary
#                       startability; DB liveness = mongo-probe.
#   redis-exporter      oliver006/redis_exporter v1.58.0-alpine (busybox:
#                       wget + nc). Healthcheck = /metrics reachable AND
#                       the redis server answering TCP.
#   mongo-probe         the pinned mongo image (owner pin mongo:9.0)
#                       running a mongosh ping against the real DB.
#   node-exporter       prom/node-exporter v1.9.1 (server-ce pin).
#   grafana             grafana/grafana-oss 11.6.0 (server-ce pin; runs
#                       as uid 472 — toolkit pre-creates + chowns the
#                       data dir; admin password generated + stored).
#
# DB targets (store keys, used by the exporters + probe):
#   MONITORING_MONGO_HOST/MONITORING_MONGO_PORT  (overleafmongo / 27017)
#   MONITORING_REDIS_HOST/MONITORING_REDIS_PORT  (overleafredis / 6379)
# Rename these only when an operator override renamed the database
# containers (container names, not compose service names).
#
# Ports (host, bound to OVERLEAF_LISTEN_IP): Prometheus 9090, Grafana 3180
# (avoids the internal :3000), exporters 9216/9121.

services:

    prometheus:
        restart: always
        image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.53.5}
        container_name: monitoring-prometheus
        entrypoint: ["/bin/sh", "-c"]
        command:
          - "sed -e 's/__OVERLEAF_HOST__/${OVERLEAF_HOST:-ollitex}/g' -e 's/__GITBRIDGE_HOST__/${GITBRIDGE_HOST:-git-bridge}/g' /etc/prometheus/prometheus.yml > /tmp/prometheus-live.yml && exec /bin/prometheus --config.file=/tmp/prometheus-live.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d --web.enable-lifecycle"
        environment:
            OVERLEAF_HOST: ollitex
            GITBRIDGE_HOST: git-bridge
        volumes:
            - ${MONITORING_DATA_PATH}:/etc/prometheus:ro   # prometheus.yml (bundled by the toolkit)
            - ${MONITORING_DATA_PATH}/prometheus-data:/prometheus
        ports:
            - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 5s

    mongodb-exporter:
        restart: always
        image: ${MONGODB_EXPORTER_IMAGE:-percona/mongodb_exporter:0.43.0}
        container_name: monitoring-mongodb-exporter
        # scratch image: single binary at /mongodb_exporter, no shell —
        # the healthcheck is binary startability; DB liveness is the
        # mongo-probe container below (the same pinned mongo image we run
        # for the database itself).
        command:
          - "--mongodb.uri=mongodb://${MONITORING_MONGO_HOST:-overleafmongo}:${MONITORING_MONGO_PORT:-27017}/sharelatex?directConnection=true"
        environment:
            MONITORING_MONGO_HOST: ${MONITORING_MONGO_HOST:-overleafmongo}
            MONITORING_MONGO_PORT: ${MONITORING_MONGO_PORT:-27017}
        ports:
            - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${MONGODB_EXPORTER_PORT:-9216}:9216"
        depends_on:
            - mongo
        healthcheck:
            test: ["CMD", "/mongodb_exporter", "--version"]
            interval: 30s
            retries: 5
            timeout: 10s
            start_period: 15s

    redis-exporter:
        restart: always
        image: ${REDIS_EXPORTER_IMAGE:-oliver006/redis_exporter:v1.58.0-alpine-alpine}
        container_name: monitoring-redis-exporter
        environment:
            REDIS_ADDR: "redis://${MONITORING_REDIS_HOST:-overleafredis}:${MONITORING_REDIS_PORT:-6379}"
            MONITORING_REDIS_HOST: ${MONITORING_REDIS_HOST:-overleafredis}
            MONITORING_REDIS_PORT: ${MONITORING_REDIS_PORT:-6379}
        ports:
            - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${REDIS_EXPORTER_PORT:-9121}:9121"
        depends_on:
            - redis
        # alpine flavor = busybox (wget + nc): healthcheck = exporter
        # /metrics reachable AND the redis server answering TCP.
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9121/metrics >/dev/null 2>&1 && busybox nc -z -w3 \"$MONITORING_REDIS_HOST\" \"$MONITORING_REDIS_PORT\""]
            start_period: 15s
            interval: 30s
            retries: 5
            timeout: 8s

    mongo-probe:
        restart: always
        # the owner-pinned mongo image — its mongosh is the canonical
        # client for a real protocol-level liveness check of the DB.
        image: ${MONGO_DOCKER_IMAGE:-mongo:9.0}
        container_name: monitoring-mongo-probe
        command: ["sh", "-c", "sleep 3600"]
        environment:
            MONITORING_MONGO_HOST: ${MONITORING_MONGO_HOST:-overleafmongo}
            MONITORING_MONGO_PORT: ${MONITORING_MONGO_PORT:-27017}
        depends_on:
            - mongo
        healthcheck:
            test: ["CMD-SHELL", "mongosh 'mongodb://$MONITORING_MONGO_HOST:$MONITORING_MONGO_PORT' --quiet --eval 'db.adminCommand(\"ping\")' >/dev/null 2>&1"]
            start_period: 20s
            interval: 30s
            retries: 5
            timeout: 10s

    node-exporter:
        restart: always
        image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.9.1}
        container_name: monitoring-node-exporter
        command: ["--path.procfs=/host/proc", "--path.rootfs=/host", "--path.sysfs=/host/sys"]
        volumes:
            - /:/host:ro
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9100/metrics"]
            start_period: 15s
            interval: 30s
            retries: 5
            timeout: 5s

    grafana:
        restart: always
        image: ${GRAFANA_IMAGE:-grafana/grafana-oss:11.6.0}
        container_name: monitoring-grafana
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
            GF_ANALYTICS_REPORTING_ENABLED: "false"
            GF_USERS_SIGNUP_ENABLED: "false"
            GF_SERVER_ROOT_URL: "http://${OVERLEAF_LISTEN_IP:-127.0.0.1}:${GRAFANA_PORT:-3180}/"
            # Hub kiosk opt-in (server-ce/grafana README: explicit owner
            # opt-in, NOT a default): anonymous Viewer role for kiosk
            # embeds + which origin may iframe Grafana. Both default to the
            # safe state (off / self-only) — embedding is a credential-
            # phishing surface while admin auth is still required.
            GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-false}
            GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
            GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
            GF_SECURITY_CSP_FRAME_ANCESTORS: ${GRAFANA_CSP_FRAME_ANCESTORS:-self}
        volumes:
            - ${MONITORING_DATA_PATH}/grafana-provisioning:/etc/grafana/provisioning
            - ${MONITORING_DATA_PATH}/grafana-dashboards:/var/lib/grafana/dashboards
            - ${MONITORING_DATA_PATH}/grafana-data:/var/lib/grafana
        ports:
            - "${OVERLEAF_LISTEN_IP:-127.0.0.1}:${GRAFANA_PORT:-3180}:3000"
        depends_on:
            - prometheus
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
            start_period: 30s
            interval: 30s
            retries: 5
            timeout: 5s
