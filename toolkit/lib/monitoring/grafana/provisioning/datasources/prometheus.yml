# D22 phase C — shared Grafana datasource (all dashboards target the
# in-compose Prometheus; pinned uid so dashboard JSON can reference it).
apiVersion: 1
datasources:
  - name: Prometheus
    uid: ollitex-prometheus
    type: prometheus
    access: proxy
    url: http://ollitex-prometheus:9090
    isDefault: true
    editable: false
