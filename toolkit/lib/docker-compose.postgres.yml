---
services:

    # Postgres 18 — the shared config DB (configstore; owner decision 2026-10-04:
    # "It is an essential part of the tech stack and data should be stored on
    # it.") and the DSN plane historyv1's chunk/blob stores use.
    #
    # Mount contract (postgres:18+ image): the single mount goes at
    # /var/lib/postgresql — the image stores data in its ./data subdirectory.
    # A mount point directly at /var/lib/postgresql/data is REJECTED by the
    # 18+ image (docker-library/postgres#37 boundary rule).
    postgres:
        restart: always
        image: "${POSTGRES_DOCKER_IMAGE}"
        container_name: overleafpg
        hostname: overleafpg
        environment:
            POSTGRES_USER: "${POSTGRES_USER}"
            POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
            POSTGRES_DB: "${POSTGRES_DB}"
        volumes:
            - "${POSTGRES_DATA_PATH}:/var/lib/postgresql"
        expose:
            - "5432"
        healthcheck:
            test: "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
            interval: 10s
            timeout: 5s
            retries: 5

    ollitex:
      depends_on:
        postgres:
          condition: service_healthy
      links:
        - postgres
