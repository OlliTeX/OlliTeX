# SeaweedFS — local S3 object storage for filestore + docstore (DEFAULT storage).
#
# Enabled by default (SEAWEEDFS_ENABLED=true in lib/default.rc); set the flag
# to false to run the previous local-fs layout instead. Four containers on
# the toolkit's shared default network, started FIRST in dependency order:
#   master -> volume, master -> filer -> s3
#
# Host ports: master 9333/19333, volume 18080 (gRPC), filer 8888/18888,
# s3 gateway 8333. Data persists on the host under
# ${OVERLEAF_DATA_PATH}/seaweedfs (master, volume, filer).
#
# Cross-service references use the container names (seaweedfs-master,
# seaweedfs-filer) — the container-name DNS the shared network provides;
# this is the same topology verified working on the CEP stack
# (2026-09-13 health check: s3 :8333 + filer :8888 green).
#
# S3 gateway notes (verified):
#   * anonymous by default — the Go services run without credentials;
#   * PUT into a nonexistent bucket is 403 NoSuchBucket — the overleaf Go
#     services auto-create their buckets at startup;
#   * HEAD / -> 405, health-check with GET / (ListAllMyBuckets).
#
# When the flag is on, the ollitex app is additionally seeded with the S3
# default-storage env (owner spec, TODO-f7baf4db):
#   filestore (Go): OVERLEAF_FILESTORE_BACKEND=s3,
#                   OVERLEAF_FILESTORE_S3_ENDPOINT / AWS_S3_ENDPOINT =
#                   http://seaweedfs-s3:8333,
#                   buckets template (template files), blobs (project blobs),
#                   global (global blobs).
#   docstore (Go):  BACKEND=s3, BUCKET_NAME=archives, AWS_S3_ENDPOINT.
services:
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --connect-timeout 3 http://localhost:9333/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    container_name: seaweedfs-master
    hostname: seaweedfs-master
    command: "master -ip=seaweedfs-master -ip.bind=0.0.0.0 -metricsPort=9327"
    ports:
      - "9333:9333"   # master HTTP
      - "19333:19333" # master gRPC
    volumes:
      - "${OVERLEAF_DATA_PATH}/seaweedfs/master:/data"
    restart: unless-stopped

  seaweedfs-volume:
    healthcheck:
      # volume speaks gRPC only; liveness = the swoc volume process is up
      test: ["CMD-SHELL", "pgrep -f 'swoc volume' >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume
    hostname: seaweedfs-volume
    depends_on:
      - seaweedfs-master
    ports:
      - "18080:18080" # volume gRPC (host 8080 is taken by another service)
    command: 'volume -mserver="seaweedfs-master:9333" -ip=seaweedfs-volume -ip.bind=0.0.0.0 -port=8080 -dir=/data -max=0'
    volumes:
      - "${OVERLEAF_DATA_PATH}/seaweedfs/volume:/data"
    restart: unless-stopped

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --connect-timeout 3 http://localhost:8888/about >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    container_name: seaweedfs-filer
    hostname: seaweedfs-filer
    depends_on:
      - seaweedfs-master
    ports:
      - "8888:8888"   # filer HTTP (root dir: GET :8888/ -> 200)
      - "18888:18888" # filer gRPC
    command: 'filer -master="seaweedfs-master:9333" -ip=seaweedfs-filer -ip.bind=0.0.0.0'
    volumes:
      - "${OVERLEAF_DATA_PATH}/seaweedfs/filer:/data"
    restart: unless-stopped

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --connect-timeout 3 http://localhost:8333 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    container_name: seaweedfs-s3
    hostname: seaweedfs-s3
    depends_on:
      - seaweedfs-filer
    ports:
      - "8333:8333" # S3 API — the API Overleaf uses
    command: 's3 -filer="seaweedfs-filer:8888" -ip.bind=0.0.0.0'
    restart: unless-stopped

  # S3 default-storage env for the app (only merged when this file is
  # included by set_seaweedfs_vars, i.e. SEAWEEDFS_ENABLED=true).
  ollitex:
    environment:
      # -- filestore (Go cmd/filestore) --
      OVERLEAF_FILESTORE_BACKEND: 's3'
      OVERLEAF_FILESTORE_S3_ENDPOINT: 'http://seaweedfs-s3:8333'
      AWS_S3_ENDPOINT: 'http://seaweedfs-s3:8333'
      TEMPLATE_FILES_BUCKET_NAME: 'template'
      OVERLEAF_HISTORY_PROJECT_BLOBS_BUCKET: 'blobs'
      OVERLEAF_HISTORY_BLOBS_BUCKET: 'global'
      # -- docstore (Go cmd/docstore, archives) --
      BACKEND: 's3'
      BUCKET_NAME: 'archives'
