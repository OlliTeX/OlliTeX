approvedGitRepositories:
  - "**"

enableGlobalCache: false

enableScripts: true

enableTelemetry: false

nodeLinker: pnp

npmMinimalAgeGate: 3d

packageExtensions:
  webdav@5.10.0:
    dependencies:
      "@nodable/entities": "*"
  "bootstrap@*":
    dependencies:
      "@popperjs/core": "*"
      jquery: "^3"
  "@overleaf/settings@*":
    peerDependencies:
      "@overleaf/logger": "*"
  "mongodb@*":
    peerDependencies:
      aws4: "*"
  "bunyan@*":
    peerDependencies:
      source-map-support: "*"
  "mocha-multi-reporters@*":
    peerDependencies:
      mocha-junit-reporter: "*"
  "mongodb-legacy@*":
    peerDependencies:
      mongodb: "*"
  "knex@*":
    dependencies:
      pg-query-stream: "*"
  "zod-validation-error@*":
    peerDependencies:
      zod: "*"
  "@vitejs/plugin-react@*":
    peerDependencies:
      vite: "*"
  "@babel/preset-env@*":
    peerDependencies:
      core-js: "*"
  "express@^4.0.0":
    dependencies:
      pug: "*"
  "@prettier/plugin-pug@*":
    dependencies:
      pug: "*"
      pug-filters: "*"
      pug-lexer: "*"
      pug-linker: "*"
      pug-load: "*"
      pug-parser: "*"
      pug-runtime: "*"
      pug-strip-comments: "*"
      pug-walk: "*"
  "postcss-loader@*":
    peerDependencies:
      autoprefixer: "*"
      tailwindcss: "*"
  "@ai-sdk/gateway@*":
    peerDependencies:
      zod: "*"
  "@ai-sdk/provider-utils@*":
    peerDependencies:
      zod: "*"
  "ai@*":
    peerDependencies:
      zod: "*"
  "@uppy/react@*":
    peerDependencies:
      "@uppy/status-bar": "*"
  "inversify@*":
    dependencies:
      reflect-metadata: "*"
  # Must match services/web's pinned mongoose version exactly (not a range):
  # sinon-mongoose checks `instanceof mongoose.Model` against its own resolved
  # copy, so any version drift from web's copy breaks that check silently.
  "sinon-mongoose@*":
    dependencies:
      mongoose: "8.24.3"
  "react-linkify@*":
    peerDependencies:
      react: "*"
  "socket.io-client@*":
    dependencies:
      ws: "*"
  "debug@*":
    peerDependenciesMeta:
      supports-color:
        optional: true

pnpZipBackend: js

supportedArchitectures:
  cpu:
    - current
    - arm64
    - x64
  libc:
    - current
    - glibc
  os:
    - current
    - darwin
    - linux


# Loose PnP resolution: allow a package to import a dependency it did not
# declare (e.g. @mantine/hooks reaching for react-dom). Needed so the vitest
# HubFrontend integration runner can load the UI tree in Node. (2026-09-07)
pnpMode: loose
