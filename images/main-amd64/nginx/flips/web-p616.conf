# P6.16 — typst module surface, flipped to the OlliTeX Go web
# (WEB_GO_PLAN.md P6.16). services/web/modules/typst (TypstRouter.mjs
# — 1 route):
#   /project/new/typst (POST) create a Typst project (basic/article/example)
# Method guard on every entry; wrong method falls through to Node — same as
# the P6.10-P6.15 confs.

location = /project/new/typst {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
