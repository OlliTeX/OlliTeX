# WEB_GO_PLAN P4.6 — project flag-writes flip (OlliTeX Go web).
#
# Routes flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (router.mjs + ProjectController.archive/unarchive/trash/untrash +
#  ProjectDeleter.mjs:156-188):
#
#   POST   /Project/:Project_id/archive   (requireLogin, ensureUserCanReadProject)  -> archive
#   DELETE /Project/:Project_id/archive   (same)                                    -> unarchive
#   POST   /project/:project_id/trash     (same)                                    -> trash
#   DELETE /project/:project_id/trash     (same)                                    -> untrash
#
# Each op mutates the per-user `archived` / `trashed` SETS (arrays of user
# ObjectIDs): archive = $addToSet{archived:uid} + $pull{trashed:uid}; unarchive
# = $pull{archived:uid}; trash = $addToSet{trashed:uid} + $pull{archived:uid};
# untrash = $pull{trashed:uid}. 200 text/plain "OK". NO audit entry (free build:
# addEntryIfManaged is a no-op). nginx location is method-agnostic so each regex
# covers its POST+DELETE pair.

location ~ ^/Project/[^/]+/archive\z {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/project/[^/]+/trash\z {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
