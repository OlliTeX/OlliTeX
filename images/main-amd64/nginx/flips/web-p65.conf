# WEB_GO_PLAN P6.5 — bib-editor library surface flip (OlliTeX Go web).
#
# Server surface of services/web/modules/bib-editor (LibraryController.mjs +
# LibraryRoutes.mjs): the two /library pages and the /library/references API
# (list/create/match/count/download/citation-key-suggestions/delete/restore +
# PATCH /:key). Live-pinned 2026-09-17 (/tmp/p65_node.json, 57 pins).
#
# Route set (all session-gated in both stacks):
#   GET    /library
#   GET    /library/trashed
#   GET    /library/references
#   POST   /library/references
#   POST   /library/references/match
#   GET    /library/references/count
#   GET    /library/references/download
#   GET    /library/references/citation-key-suggestions
#   POST   /library/references/delete
#   POST   /library/references/restore
#   PATCH  /library/references/:key
#
# Method guards keep Node-handled verbs on Node (Node 404 for the wrong
# method); the literal API verb paths are pinned to Node for the PATCH
# method (Node has no PATCH route there → Node 404), so the Go :key route
# only sees real citation keys.

# Pages (GET-only).
location = /library {
  if ($request_method !~ ^\(GET\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /library/trashed {
  if ($request_method !~ ^\(GET\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# API GET set (list / count / download / citation-key-suggestions).
location ~ ^/library/references(/count|/download|/citation-key-suggestions)?$ {
  if ($request_method !~ ^\(GET\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# API POST set (create / match / delete / restore).
location ~ ^/library/references(/match|/delete|/restore)?$ {
  if ($request_method !~ ^\(POST\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# PATCH on literal verb paths → Node (no PATCH route there → Node 404 shape).
location ~ ^/library/references/(count|download|match|delete|restore|citation-key-suggestions)$ {
  proxy_pass http://127.0.0.1:4000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# PATCH /library/references/:key (real citation keys only).
location ~ ^/library/references/([^/]+)$ {
  if ($request_method !~ ^\(PATCH\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
