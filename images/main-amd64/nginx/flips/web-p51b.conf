# WEB_GO_PLAN P5.1b — editor DETACH shell flip (OlliTeX Go web).
#
# Extends the P5.1a main-shell flip to the two detach variants, which Node
# renders with a DIFFERENT template (project/ide-react-detached):
#
#   GET /editor/:Project_id                              (ide-react chrome)
#   GET /Project/:Project_id                             (ide-react chrome)
#   GET /editor/:Project_id/detacher                      (ide-react chrome, ol-detachRole=detacher)
#   GET /Project/:Project_id/detacher                     (ide-react chrome, ol-detachRole=detacher)
#   GET /editor/:Project_id/detached                      (ide-react-detached chrome)
#   GET /Project/:Project_id/detached                     (ide-react-detached chrome)
#
# Node selects the template in ProjectController.loadEditor:
#   const template = detachRole === 'detached' ? 'project/ide-react-detached'
#                                               : 'project/ide-react'
# where detachRole = params.detachRole (only 'detached' changes the chrome;
# 'detacher' + the bare page share the ide-react chrome and differ only in
# ol-detachRole + ol-navbar.currentUrl + the <link rel=alternate> href).
#
# Go renders BOTH chromes from the views package (views/editor.go selects
# editorTemplate vs detachedTemplate on EditorData.Detached), so ALL SIX
# routes are byte-parity candidates and are flipped to the Go shadow.
#
# ONLY the GET/HEAD verb on THESE EXACT project-id routes (with an optional
# single /detacher|/detached suffix) goes to Go. Every other verb AND every
# deeper sub-route (/editor/<id>/file, .../doc, .../compile, ...) STAYS on
# Node (4000) — those are P5.2 (editor control plane), not the page shell.

# editor legacy + new prefixes, main shell AND detach variants.
# NOTE: the regex is QUOTED — nginx's config tokenizer treats unquoted {
# } as token delimiters, so "...{24}..." is mandatory here.
location ~ "^/(editor|Project)/[0-9a-f]{24}(/(detacher|detached))?\z" {
  if ($request_method !~ ^(GET|HEAD)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
