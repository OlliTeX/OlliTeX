# WEB_GO_PLAN P4.7 — basic project creation flip (OlliTeX Go web).
#
# Route flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (router.mjs:577-583 newProject + ProjectController.mjs:463-500
#  createBasicProject + ProjectCreationHandler.mjs:90-101
#  createBasicProject + DocstoreManager.updateDoc basic + 
#  HistoryManager.initializeProject basic):
#
#   POST /project/new
#     body { projectName?: string, template?: string }   (newProjectSchema, z.strictObject)
#     template "example" -> example project (DEFERRED to P4.7b: needs
#        filestore + clsi sample files), template basic/absent -> basic project
#
#   200 application/json
#     { "project_id": "<new ObjectId hex>",
#       "owner_ref":  "<owner uid hex>",
#       "owner": { first_name, last_name, email, _id } }
#
#   400 contract (pinned):
#     * body not valid JSON object  -> 400 text/plain "Invalid JSON"
#     * projectName not a string    -> 400 text/plain "Project name cannot be blank"
#                                      (empty/whitespace) or
#                                      "Project name cannot contain / characters"
#                                       (slash) or "Project name is too long" (>150)
#     * unknown key                 -> 400 text/plain "Unrecognized key(s) in object: ..."
#   403 anonymous (requireLogin via CSRF-first middleware)

location = /project/new {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_request_buffering off;
}
