    # ---- Ollitex Go-cutover flip table — P0 (WEB_GO_PLAN.md M0) ----
    # These EXACT paths are answered by the Go web shadow service
    # (127.0.0.1:4010). `location =` (exact match) is used so no other
    # path can ever be swept into the Go service by prefix accident.
    # Each flip unit must pass the three-leg parity gate (Node==Go byte
    # parity vs the e2e stack, then e2e+live green) before it lands here.
    #
    # Flip unit "status" (router.mjs publicApiRouter / privateApiRouter):
    location = /status {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
    # Flip unit "healthcheck" (HealthCheckController.mjs). The vhost also
    # carries a REGEX block `location ~* ^/health_check` (stock 404 for the
    # rest) — nginx EXACT matches (`location =`) outrank regex ones, so
    # these three exact paths reach the Go service and every other
    # /health_check path keeps the stock 404.
    location = /health_check/redis {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /health_check/mongo {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /health_check/api {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Flip unit "devcsrf" (router.mjs:1239 — session/CSRF interop oracle):
    location = /dev/csrf {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # ---- end P0 flips ----

# ---- P1 wave: auth + static + system messages (exact locations) ----
