# P6.15 — languagetool module surface, flipped to the OlliTeX Go web
# (WEB_GO_PLAN.md P6.15). services/web/modules/languagetool
# (LanguageToolRouter.mjs — 3 routes):
#   /languagetool/languages   (GET)  LT language list proxy
#   /languagetool/check       (POST) LT grammar-check proxy
#   /admin/languagetool/check (POST) admin connection check (site admin)
# Method guard on every entry; wrong method falls through to Node — same as
# the P6.5-P6.14 confs.

location = /languagetool/languages {
  if ($request_method !~ ^(GET|HEAD)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location = /languagetool/check {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location = /admin/languagetool/check {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
