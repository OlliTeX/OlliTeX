# WEB_GO_PLAN P4.13b — new-project zip upload flip (OlliTeX Go web).
#
# Route flipped to the Go shadow (127.0.0.1:4010), pinned by the source:
#
#   POST /project/new/upload  (UploadsRouter.mjs uploadProject route)
#
# Node pipeline (pinned, oracle 2026-09-15 probes):
#   csrf (global) → requireLogin → rateLimit → multer single 'qqfile'
#   (no file: 400 invalid_upload_request; >50MiB: 422 'File too large';
#    wrong field: LIMIT_UNEXPECTED_FILE → 500 HTML page) →
#   ProjectUploadManager.createProjectFromZipArchive (zip guards: 422
#   'Invalid zip file' / 'Zip doesn’t contain any file' /
#   'Zip contents too large') → blank project + import (docstore PUT
#   @3016 / v1H blob PUT @3100) → createNewFolderStructure ($set
#   rootFolder + $inc version) → DU updateProjectStructure @3003 →
#   setRootDocFromName → 200 {"success":true,"project_id":"<hex24>"}
#   (import failure after creation: 500 'Upload failed' +
#    zip-import-failure cleanup).
#
# Only the POST verb goes to Go; GET/PUT/DELETE on this path is Node's
# 404 territory and stays on Node (4000).

location ~ ^/project/new/upload\z {
  if ($request_method !~ ^(POST)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
