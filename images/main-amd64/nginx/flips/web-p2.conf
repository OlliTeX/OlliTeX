# WEB_GO_PLAN P2 — token access + password reset flips (OlliTeX Go web).
#
# Routes flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (router.mjs + TokenAccessRouter.mjs + PasswordResetRouter.mjs):
#
#   GET  /user/password/reset        (+ ?error= variants — location = matches
#   POST /user/password/reset          the path; queries ride through)
#   GET  /user/password/set
#   POST /user/password/set
#   POST /user/reconfirm
#   GET  /<rw-token>                 rw = [0-9]+[a-z]\{6,12\}
#   GET  /read/<ro-token>            ro = 12 lowercase letters
#   POST /<rw-token>/grant
#   POST /read/<ro-token>/grant
#   GET  /project/<id>/sharing-updates
#   POST /project/<id>/sharing-updates/join
#   POST /project/<id>/sharing-updates/view
#
# Regex locations must precede the stock regex blocks (nginx first-match-in-
# file-order), so the spec inserts the include before `location / {`.

location = /user/password/reset {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /user/password/set {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /user/reconfirm {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/[0-9]+[a-z]\{6,12\}(/grant)?$ {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/read/[a-z]\{12\}(/grant)?$ {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/project/[0-9a-f]\{24\}/sharing-updates(/(join|view))?$ {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
