# WEB_GO_PLAN P3.3 — user pages / user settings leaf flips (OlliTeX Go web).
#
# Routes flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (app/src/routing.mjs — user router + modules/notifications preferences
# are OUT of scope here):
#
#   GET  /user/settings              (My settings page  + logged-in guard)
#   POST /user/settings              (updateUserSettings — zod 30-field schema)
#   GET  /user/sessions              (sessions page)
#   GET  /user/sessions/list         (JSON list)
#   POST /user/sessions/clear        (logout all sessions + mail + audit)
#
# Exact locations match path only; other methods on these paths get the
# identical Express "Cannot <METHOD> <path>" 404 from both stacks (Go core
# fallback renders the same page).

location = /user/settings {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /user/sessions {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /user/sessions/list {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /user/sessions/clear {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
