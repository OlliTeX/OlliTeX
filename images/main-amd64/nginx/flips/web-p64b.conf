# WEB_GO_PLAN P6.4b — OlliTeX llm module, PROJECT-scoped surface (live-LLM
# endpoints) flip (OlliTeX Go web).
#
# Server surface of services/web/modules/llm (LLMChatController.mjs +
# LLMComplianceController.mjs, module mount /project/:id/router.mjs =>
# /project/:Project_id/llm/*), live-pinned 2026-09-16 (/tmp/p64b_node.json,
# /tmp/p64b_job.json).
#
#   GET  /project/<oid>/llm/models
#   GET  /project/<oid>/llm/features
#   GET  /project/<oid>/llm/source-context
#   GET  /project/<oid>/llm/prompts
#   POST /project/<oid>/llm/chat
#   POST /project/<oid>/llm/completion
#   POST /project/<oid>/llm/compile-fix
#   POST /project/<oid>/llm/grammar
#   POST /project/<oid>/llm/generate
#   GET  /project/<oid>/llm/compliance/rubrics
#   POST /project/<oid>/llm/compliance/start
#   GET  /project/<oid>/llm/compliance/status/<jobId>
#   POST /project/<oid>/llm/compliance/cancel/<jobId>
#
# <oid> is a 24-hex Mongo ObjectId (Node zod objectId), so the regex cannot
# swallow non-LLM project routes (/compile, /files, ...). Method guards keep
# Node-handled verbs on Node; wrong-method LLM paths fall through to the
# generic location / (Node 404), matching Node's express route table.

# GET set (exact tokens; compliance/status has the longest tail so regex
# alternation order is safe — all alternatives are word-complete).
location ~ ^/project/[0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]/llm/(models|features|source-context|prompts|compliance/(rubrics|status/[^/]+))$ {
  if ($request_method !~ ^\(GET\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# POST set.
location ~ ^/project/[0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]/llm/(chat|completion|compile-fix|grammar|generate|compliance/(start|cancel/[^/]+))$ {
  if ($request_method !~ ^\(POST\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
