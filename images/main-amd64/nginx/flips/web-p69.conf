# P6.9 — webdav module surface, flipped to the OlliTeX Go web (WEB_GO_PLAN.md P6.9).
# 13 routes: user connect/disconnect/status; project link/unlink/state/files/pull/push/
# conflict/project-name; new-from-webdav. Method guard on every entry; wrong method/
# unknown subpath falls through to the default "location /" → Node (unlinked sandbox ⇒
# unobservable divergence there; the pinned battery covers the full module surface).
# Project id = [^/]+ (Go handler regex parity; nginx lexer rejects {N} quantifiers).
# The Go/Node requireLogin chain is identical: anon GET+accept-json → 401, GET no-json
# → 302 /login, non-GET → 403 — covered by the gate's anon pins.
location = /user/webdav/status {
  if ($request_method !~ ^(GET)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location = /user/webdav/connect {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location = /user/webdav/disconnect {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}

# member-only project routes (requireUserCanWriteProjectContent inside Go)
location ~ ^/project/[^/]+/webdav/state$ {
  if ($request_method !~ ^(GET|DELETE)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
