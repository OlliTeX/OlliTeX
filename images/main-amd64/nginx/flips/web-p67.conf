# WEB_GO_PLAN P6.7 — orcid-picker module surface flip (OlliTeX Go web).
#
# Server surface of services/web/modules/orcid-picker (OrcidPickerRouter.mjs
# + OrcidService.mjs):
#   GET /orcid-picker/search?q=        searchAuthors (ORCID expanded-search)
#   GET /orcid-picker/works?orcid=     fetchWorks (ORCID works, year-desc)
#   GET /orcid-picker/fetch-bib?orcid=
#       &putCode=                      fetchBibtexFromOrcid
#                                       (citation → doi.org → constructed)
#
# Live-pinned 2026-09-17 (direct dual-stack, byte-identical):
#   400 battery exact; anon 401/302/403 exact;
#   search "Alan Turing" → 200 {"results":[]} (empty ORCID registry match);
#   works/fetch-bib never-registered ORCID → 502
#       {"error":"Upstream API responded with 404"};
#   live result sets (search "Turing", works 0000-0002-0185-5110,
#   fetch-bib putCode 17643012) byte-identical Node vs Go.
#
# All three routes are GET; the method guards keep Node-handled verbs on
# Node so the Go routes only see the pinned GET surface.

location = /orcid-picker/search {
  if ($request_method !~ ^\(GET\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /orcid-picker/works {
  if ($request_method !~ ^\(GET\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /orcid-picker/fetch-bib {
  if ($request_method !~ ^\(GET\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
