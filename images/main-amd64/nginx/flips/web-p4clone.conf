# WEB_GO_PLAN P4.9 — project clone flip (OlliTeX Go web).
#
# Route flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (router.mjs:792-795 + ProjectController.mjs:398-461 +
#  ProjectDuplicator.mjs:88-210):
#
#   POST /Project/:Project_id/clone   (ensureUserCanReadProject)
#     body { projectName?: string, isDebugCopy?: boolean, cloneHistory?: boolean,
#            cloneRanges?: boolean, tags?: [{id: objectId}] }          (zod strict)
#     -> 200 application/json {name,lastUpdated,project_id,owner_ref,owner:{...}}
#        missing projectName -> 500 generic error page (Node .trim() quirk)
#
#   POST /project/new is flipped for gate fixture setup (P4.7).

location = /project/new {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_request_buffering off;
}

location ~ ^/Project/[^/]+/clone\z {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
