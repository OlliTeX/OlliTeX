# WEB_GO_PLAN P5.2b — COMPILE OUTPUT READ flip (OlliTeX Go web).
#
# The three web-layer output routes (Node CompileController /
# ClsiCacheController, live-pinned 2026-09-16):
#
#   GET /download/project/<pid>/build/<build_id>/output/output.pdf
#       (CompileController.downloadPdf — the download-PDF button)
#   GET /download/project/<pid>/build/<editorBuildId>/output/cached/<file>
#       (ClsiCacheController.downloadFromCache — clsi-cache disabled in
#        this stack: 404 validation shapes)
#   GET /project/<pid>/output/cached/output.overleaf.json
#       (ClsiCacheController.getLatestBuildFromCache — 404 "Not Found")
#
# go to the Go shadow (127.0.0.1:4010). The PDF preview pane is NOT in
# this surface: overleaf.conf's own locations proxy the anonymous/user
# `/project/…/build/…/output.output.*` fast path straight to clsi-nginx
# (:8080) — that stays as-is after the cutover. Everything else STAYS on
# Node (4000).
#
# Note: `^~` prefix wins over the regex locations below and over the
# general `location /`; the two /download/project/ routes share the
# prefix, route B needs the exact regex (it sits under /project/, which
# still routes to Node otherwise).
location ^~ /download/project/ {
  if ($request_method !~ ^(GET)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}
location ~ "^/project/[0-9a-f]{24}/output/cached/output\.overleaf\.json\z" {
  if ($request_method !~ ^(GET)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}
