# WEB_GO_PLAN P6.4a — OlliTeX llm module (deterministic settings surface)
# flip (OlliTeX Go web).
#
# Server surface of services/web/modules/llm (LLMSettingsController.mjs +
# LLMAdminController.mjs, LLM_ALLOW_USER_SETTINGS=true in this deployment),
# live-pinned 2026-09-16 (/tmp/p64a_node.json). P6.4a is the deterministic
# local-state slice: BYO provider rows, selected model, user compliance
# rubrics, per-user + site usage, grammar prefs, admin settings file +
# check/scan (offline: connection failure paths), feature flags, 301s,
# bad-JSON 400 negotiation. P6.4b = project-scoped chat/completion/
# review/compliance (live LLM calls) — intentionally NOT flipped here:
# the /project/:id/llm/* routes stay on Node.
#
#   GET    /user/llm-providers
#   POST   /user/llm-providers
#   POST   /user/llm-providers/check
#   POST   /user/llm-providers/scan
#   POST   /user/llm-providers/:id
#   POST   /user/llm-providers/:id/delete
#   GET|POST /user/llm/selected-model
#   GET|POST /user/llm/compliance
#   GET    /user/llm-usage
#   GET|POST /user/llm-settings/grammar
#   GET    /user/llm-settings                 (301 -> hub)
#   GET    /admin/llm/settings                (301 -> hub)
#   GET    /admin/llm/settings/json
#   POST   /admin/llm/settings
#   POST   /admin/llm/settings/check
#   POST   /admin/llm/models
#   GET    /admin/llm/usage
#
# Method guards keep Node-handled verbs on Node; the Go shadow only owns
# the listed (method, path) pairs.

location = /user/llm-providers {
  if ($request_method !~ ^\(GET|POST\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location = /user/llm-providers/check {
  if ($request_method !~ ^\(POST\)$) {
