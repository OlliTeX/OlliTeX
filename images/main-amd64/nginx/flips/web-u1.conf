# P7 completion U1 — project-tag surface + POST /api/project (Go web drop-in),
# flipped to the OlliTeX Go shadow (127.0.0.1:4010), pinned by the live Node
# oracle (WEB_GO_PLAN.md U1). 10 routes:
#
#   GET/POST /tag
#   POST /tag/:tagId/rename            POST /tag/:tagId/edit
#   DELETE /tag/:tagId                 GET /user/:userId/tag  (web: 404 page)
#   POST /tag/:tagId/project/:projectId   DELETE /tag/:tagId/project/:projectId
#   POST /tag/:tagId/projects          POST /tag/:tagId/projects/remove
#   POST /api/project
#
# Method guard on every entry (wrong method falls through to "location /" →
# Node, same as the pinned p620 conf).

location = /tag {
  if ($request_method !~ ^(GET|POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location = /api/project {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location ~ ^/tag/[^/]+/rename$ {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/tag/[^/]+/edit$ {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/user/[^/]+/tag$ {
  if ($request_method !~ ^(GET)$) { proxy_pass http://127.0.0.1:4000; }

  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/tag/[^/]+/project/[^/]+$ {
  if ($request_method !~ ^(POST|DELETE)$) { proxy_pass http://127.0.0.1:4000; }

  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/tag/[^/]+/projects$ {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/tag/[^/]+/projects/remove$ {
  if ($request_method !~ ^(POST)$) { proxy_pass http://127.0.0.1:4000; }

  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
# DELETE /tag/:tagId — plain id, after the longer /tag/... paths (regex
# locations are matched in file order; the member paths are anchored to
# /project/, so this cannot steal them).
location ~ ^/tag/[^/]+$ {
  if ($request_method !~ ^(DELETE)$) { proxy_pass http://127.0.0.1:4000; }

  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
