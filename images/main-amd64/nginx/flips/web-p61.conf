# WEB_GO_PLAN P6.1 — ollitex-hub module flip (OlliTeX Go web).
#
# Server surface of services/web/modules/ollitex-hub (HubRouter.mjs),
# live-pinned 2026-09-16 (oracle /tmp/p61):
#
#   GET    /hub            (requireLogin)        → React hub page
#   GET    /hub/admin      (requireLogin)        → 302 /hub
#   GET    /hub/workspace  (requireLogin)        → 302 /hub
#   GET    /api/hub-theme  (requireLogin)        → JSON null | theme
#   PUT    /api/hub-theme  (site admin, csrf)    → theme JSON | 400 {"error":…}
#   DELETE /api/hub-theme  (site admin, csrf)    → {"ok":true}
#   GET    /api/hub/health (login+site admin)    → core health JSON
#   GET    /api/hub/notes  (global login gate)   → docs/RELEASE_NOTES.md
#
# Go and Node share Mongo (users, hubthemes) + Redis (sessions), so one
# logged-in session drives both legs; the gate diffs Node baseline vs
# flipped Go output (status / CT / CD / Location / ETag / body with the
# nonce + csrf + volatile health fields normalized).

location = /hub {
  if ($request_method !~ ^(GET)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
location = /hub/admin {
  if ($request_method !~ ^(GET)$) {
