# P6.13 — template gallery module surface, flipped to the OlliTeX Go web (WEB_GO_PLAN.md P6.13).
# 16 routes under the template namespace (WEB_GO_PLAN.md P6.13 route table =
# services/web/modules/template-gallery TemplateGalleryRouter.mjs):
#   /api/template (GET)                     gallery single-item lookup
#   /api/template/categories (GET)          gallery categories
#   /api/templates (GET)                    gallery list (by/order paging)
#   /api/templates/admin-list (GET)         mgmt list (authz ladder)
#   /template/new/:id (POST)                create-from-project (authz)
#   /template/:id (GET)                     301 → /hub#/templates.all (legacy)
#   /template/:id/bundle (GET)              bundle zip stream (filestore proxy)
#   /template/bundle/import (POST)          mgmt import (authz + zip validate)
#   /template/bundle/import-url (POST)      mgmt import-url (SSRF allowlist)
#   /template/:id/edit (POST)               mgmt edit (authz + $set)
#   /template/:id/delete (DELETE)           mgmt delete (authz + fire forget FS)
#   /template/:id/preview (GET|HEAD)        bundle preview page (404 fallback)
#   /templates (GET)                        301 → /hub#/templates.all
#   /templates/ (GET)                       301 (trailing slash, :category? empty)
#   /templates/manage (GET)                 301 → /hub#/site.general.managetpl
#   /templates/:category (GET)              301 (single segment only; a/b → 404)
# Method guard on every entry; wrong method/unknown tail falls through to the
# default "location /" → Node (the pinned battery covers the full surface incl.
# the global anon chain 401/302/403, the 403 mgmt chain, the ghost 500 pages,
# and the admin nav/ExposedSettings per-user page variants).
# [^/]+ for ids (nginx lexer rejects {N} quantifiers) — same as P6.9-P6.12.
location ~ ^/api/template$ {
  if ($request_method !~ ^(GET)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  proxy_pass http://127.0.0.1:4010;
}
location ~ ^/api/template/categories$ {
  if ($request_method !~ ^(GET)$) { proxy_pass http://127.0.0.1:4000; }

  add_header X-Frame-Options SAMEORIGIN;
