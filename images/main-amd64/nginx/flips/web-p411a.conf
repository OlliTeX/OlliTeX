# WEB_GO_PLAN P4.11a — editor entity creation flip (OlliTeX Go web).
#
# Node sources (oracle):
#   router.mjs (EditorRouter) — POST /project/:Project_id/doc, /folder
#   EditorHttpController.mjs (addDoc/addFolder validation + error mapping)
#   EditorController.mjs (trim + delegation)
#   ProjectEntityUpdateHandler.mjs (lock, docstore updateDoc, tree insert)
#   ProjectEntityMongoUpdateHandler.mjs (_putElement checks + $push write)
#
#   POST /project/:id/doc     {name?, parent_folder_id?(oid|null)}
#   POST /project/:id/folder  {name?, parent_folder_id?(oid|null)}
#
# Method guards keep Node-handled verbs on Node.

location ~ ^/project/[^/]+/doc\z {
  if ($request_method !~ ^(POST)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/project/[^/]+/folder\z {
  if ($request_method !~ ^(POST)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
