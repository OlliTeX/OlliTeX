# WEB_GO_PLAN P4.8 — project delete/restore flip (OlliTeX Go web).
#
# Routes flipped to the Go shadow (127.0.0.1:4010), pinned by the source
# (router.mjs:771-780 deleteProject/restoreProject +
#  ProjectController.mjs:546-569 + ProjectDeleter.mjs:82-198):
#
#   DELETE /Project/:Project_id                    -> hard delete (deletedProjects record,
#                                                     doc-updater flush+delete, docstore archive)
#   POST   /Project/:Project_id/restore            -> $unset {archived: true}
#   POST   /Project/:Project_id/archive            -> (P4.6; flipped here for gate fixture setup)
#
#   All three: 200 text/plain "OK"; 404 HTML page when the project is missing
#   (ensureUserCanAdminProject); 404 application/json
#   {"error":"Validation error: Invalid Mongo ObjectId at \"params.Project_id\"",
#    "statusCode":404} for a malformed id; 403 {"message":"restricted"} for a
#   non-member; 403 "Forbidden" (CSRF) for anonymous.  nginx locations are
#   method-agnostic, so the archive regex covers POST+DELETE.
#   POST /project/new is flipped as well (gate fixture creation).

location = /project/new {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_request_buffering off;
}

location ~ ^/Project/[^/]+/restore\z {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/Project/[^/]+/archive\z {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# exact single-segment match: DELETE /Project/<24hex> (hard delete)
location ~ ^/Project/[^/]+\z {
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
