# WEB_GO_PLAN P6.6 — zotero module surface flip (OlliTeX Go web).
#
# Server surface of services/web/modules/zotero (ZoteroRouter.mjs +
# ZoteroController.mjs + ZoteroSection.mjs + TokenManager.mjs +
# ZoteroApiClient.mjs + ZoteroOAuth.mjs):
#   GET    /user/zotero/status
#   GET    /user/zotero/groups
#   GET    /user/zotero/oauth
#   GET    /user/zotero/oauth/callback
#   DELETE /user/zotero
#   GET    /user/zotero/picker/libraries
#   GET    /user/zotero/picker/collections
#   GET    /user/zotero/picker/items
#   GET    /user/zotero/picker/bibtex
#
# Live-pinned 2026-09-17 in both phases (site_settings.zotero.enabled
# false → 403 disabled; true → not-linked battery 200 null / 409
# zotero_not_linked / 400 no items selected / 403 Invalid OAuth token).
# The e2e user is zotero-unlinked, so no zotero.org call is made on the
# pinned paths (the oauth requestToken start is a live fast-fail in the
# sandbox and pins the same 400 on both stacks).
#
# Method guards keep Node-handled verbs on Node (Node 404/405 for the wrong
# method); the exact-match locations carry query strings for the
# picker routes.

location = /user/zotero/status {
  if ($request_method !~ ^\(GET\)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

