# WEB_GO_PLAN P4.10b — project invites flip (OlliTeX Go web).
#
# Node sources (oracle):
#   CollaboratorsRouter.mjs (invite routes)
#   CollaboratorsInviteController.mjs / CollaboratorsInviteHandler.mjs /
#   CollaboratorsInviteGetter.mjs / CollaboratorsEmailHandler.mjs
#
#   POST   /project/:id/invite                       (admin; {email,privileges})
#   GET    /project/:id/invites                      (admin)
#   DELETE /project/:id/invite/:invite_id            (admin)
#   POST   /project/:id/invite/:invite_id/resend     (admin)
#   GET    /project/:id/invite/token/:token          (anon ok — HTML view)
#   POST   /project/:id/invite/token/:token/accept   (login)
#   GET    /project/:id/tokens                       (read)
#   split-test-disabled: sharing-link get/post, share get/post, share/validate
#
# Method guards keep Node-handled verbs on Node; the Go shadow only owns the
# listed (method, path) pairs.

location ~ ^/project/[^/]+/invite\z {
  if ($request_method !~ ^(POST)$) {
    proxy_pass http://127.0.0.1:4000;
  }
  proxy_pass http://127.0.0.1:4010;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/project/[^/]+/invites\z {
